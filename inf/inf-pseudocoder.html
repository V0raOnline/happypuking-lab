    'ej.tcomillas.titulo': 'Con comillas y sin',
    'ej.tcomillas.consigna': '¿Qué se muestra en pantalla?',
    'ej.tcomillas.trampa': 'El 7 es un número y «"7"» es un texto: aunque se vean parecidos, son valores de distinto tipo y «a = b» da falso. Por eso se ejecuta el «sino».',
    'ej.tnocalcula.titulo': 'Un texto no se multiplica',
    'ej.tnocalcula.consigna': '¿Qué se muestra? Si el programa se detiene por un error, cuenta solo lo que se mostró antes.',
    'ej.tnocalcula.trampa': 'Un texto no sirve para calcular: «"ab" * 2» es un error y el programa se detiene en esa línea. El 9 nunca llega a ejecutarse.',
    'ej.tsino.titulo': 'Guardar un sí o no',
    'ej.tsino.consigna': '¿Qué se muestra en pantalla?',
    'ej.tsino.trampa': 'Una comparación da «verdadero» o «falso», y ese valor se puede guardar en una variable y mostrar. «si calor» pregunta por el valor guardado, sin comparar nada más.',
    'ej.esaludo.titulo': 'Leer un nombre',
    'ej.esaludo.consigna': '¿Qué se muestra en pantalla?',
    'ej.esaludo.trampa': '«leer nombre» guarda en la variable lo que escribe la persona, y «Hola » + nombre une los dos textos: sale «Hola Ana». Con otro nombre saldría otro saludo, sin cambiar el programa.',
    'ej.eorden.titulo': 'Cada leer, un dato',
    'ej.eorden.consigna': '¿Qué se muestra en pantalla?',
    'ej.eorden.trampa': 'Cada «leer» toma el siguiente dato, en el orden en que la persona los escribió: a recibe el 3 y b recibe el 4. Se muestra primero b.',
    'ej.esumatxt.titulo': 'Sumar lo que llega',
    'ej.esumatxt.consigna': '¿Qué se muestra en pantalla?',
    'ej.esumatxt.trampa': 'Lo que escribe la persona llega siempre como texto, aunque sean cifras: «"2" + "3"» une los dos textos y sale «23», no 5.',
    'ej.enumero.titulo': 'Convertir en número',
    'ej.enumero.consigna': '¿Qué se muestra en pantalla?',
    'ej.enumero.trampa': '«numero(a)» convierte el texto «2» en el número 2, y entonces «+» sí suma: sale 5. Sin la conversión saldría «23».',
    'ej.ecalor.titulo': 'Leer y decidir',
    'ej.ecalor.consigna': '¿Qué se muestra en pantalla?',
    'ej.ecalor.trampa': 'Con la conversión, «numero(t)» es el número 25 y la comparación «25 > 20» es verdadera: se muestra «calor».',
    'ej.ecompara.titulo': 'Comparar sin convertir',
    'ej.ecompara.consigna': '¿Qué se muestra? Si el programa se detiene por un error, cuenta solo lo que se mostró antes.',
    'ej.ecompara.trampa': 'El dato llega como texto y un texto no se puede comparar con el número 20: el programa se detiene en el «si». Antes hay que convertirlo: «numero(t) > 20».',
    'ej.sdia.titulo': 'Elegir un caso',
    'ej.sdia.consigna': '¿Qué se muestra en pantalla?',
    'ej.sdia.trampa': 'El «segun» compara el valor de dia (2) con cada caso, de arriba abajo, y ejecuta solo el primero que coincide: «martes». Después termina: los casos siguientes no se ejecutan.',
    'ej.slista.titulo': 'Varios valores en un caso',
    'ej.slista.consigna': '¿Qué se muestra en pantalla?',
    'ej.slista.trampa': 'Un caso puede reunir varios valores separados por comas: «caso 6, 7» se cumple si dia vale 6 o 7. Como dia vale 7, se ejecuta ese caso y el «sino» no.',
    'ej.ssin.titulo': 'Ningún caso coincide',
    'ej.ssin.consigna': '¿Qué se muestra en pantalla?',
    'ej.ssin.trampa': 'Ningún caso coincide con 4 y no hay «sino»: el «segun» no ejecuta nada y el programa sigue después de su «fin».',
    'ej.stexto.titulo': 'Casos con texto',
    'ej.stexto.consigna': '¿Qué se muestra en pantalla?',
    'ej.stexto.trampa': 'Con textos, el caso tiene que ser idéntico al valor: «"verde"» coincide con «"verde"». Las mayúsculas cuentan: «"Verde"» no sería igual.',
    'ej.sresto.titulo': 'Según el resto',
    'ej.sresto.consigna': '¿Qué se muestra en pantalla?',
    'ej.sresto.trampa': 'El «segun» evalúa la expresión «n % 3» una sola vez: 7 % 3 es 1, así que se ejecuta el caso 1.',
    'ej.hcuenta.titulo': 'Contar con repetir',
    'ej.hcuenta.consigna': '¿Qué se muestra en pantalla?',
    'ej.hcuenta.trampa': 'El «repetir» ejecuta el bloque y después comprueba «n > 3». Mientras sea falsa, repite: salen 1, 2 y 3, y cuando n llega a 4 la condición es verdadera y termina. La condición dice cuándo parar.',
    'ej.halmenos.titulo': 'Al menos una vez',
    'ej.halmenos.consigna': '¿Qué se muestra en pantalla?',
    'ej.halmenos.trampa': 'El bloque se ejecuta antes de comprobar nada: se muestra el 5 aunque n ya cumple «n > 3». Solo después se ve que hay que parar. Con «mientras» no se habría ejecutado ninguna vez.',
    'ej.hatras.titulo': 'Cuenta atrás con repetir',
    'ej.hatras.consigna': '¿Qué se muestra en pantalla?',
    'ej.hatras.trampa': 'Primero se muestra y después se resta; «vidas = 0» se comprueba tras restar, así que el 0 nunca llega a mostrarse: sale 3 2 1.',
    'ej.hcompara.titulo': 'Mientras y repetir',
    'ej.hcompara.consigna': '¿Qué se muestra en pantalla?',
    'ej.hcompara.trampa': 'El «mientras» muestra 1 y 2 y termina con n = 3. El «repetir» entra una vez sin preguntar: muestra el 3, y como n vale 4 y «n > 4» todavía es falsa, repite y muestra el 4; con n = 5 se sale.',
    'ej.hsuma.titulo': 'Sumar hasta llegar',
    'ej.hsuma.consigna': '¿Qué se muestra en pantalla?',
    'ej.hsuma.trampa': 'En cada vuelta se suma i al total y después se comprueba «total >= 6»: el total va valiendo 1, 3 y 6. Al llegar a 6 la condición es verdadera, se termina y se muestra 6.',
    'ej.rpan.titulo': 'El total no se actualiza',
    'ej.rpan.consigna': '¿Qué valor se muestra?',
    'ej.rpan.trampa': 'total se calculó cuando panes valía 2. Cambiar panes después no recalcula nada: una variable guarda un resultado, no una receta. PRECIO, por su parte, no cambia en ningún momento.',
    'ej.rvidas.titulo': 'Copiar una constante',
    'ej.rvidas.consigna': '¿Qué valores se muestran?',
    'ej.rvidas.trampa': 'vidas copia el valor de MAX (3) y después baja a 2. MAX no se ve afectada: sigue valiendo 3, porque una constante no cambia mientras el programa se ejecuta.',
    'ej.rmayores.titulo': 'Repetir y decidir',
    'ej.rmayores.consigna': '¿Qué números se muestran?',
    'ej.rmayores.trampa': 'El «para» recorre del 1 al 5, los dos incluidos, y el «si» deja pasar solo los mayores que 3: el 4 y el 5.',
    'ej.rsuma.titulo': 'Sumar o restar según el caso',
    'ej.rsuma.consigna': '¿Cuánto vale total al final?',
    'ej.rsuma.trampa': 'En cada vuelta se hace una cosa u otra, nunca las dos: los dos primeros números suman (1 + 2 = 3) y los dos últimos restan 1 cada uno: 3 - 1 - 1 = 1.',
    'ej.justo.titulo': 'Justo en el límite',
    'ej.justo.consigna': '¿Qué mensaje sale?',
    'ej.justo.trampa': '«>=» incluye el 20; «>» no. El caso del borde es donde se esconden los fallos.',
    'ej.unootro.titulo': 'Uno o el otro',
    'ej.unootro.consigna': '¿Qué mensajes salen y en qué orden?',
    'ej.unootro.trampa': 'Si el «si» se cumple, el «sino» se salta entero. Nunca se ejecutan los dos.',
    'ej.vueltas.titulo': 'Contar vueltas',
    'ej.vueltas.consigna': '¿Qué números se muestran?',
    'ej.vueltas.trampa': 'Con «<» el 4 se queda fuera: cuando n llega a 4 la condición ya no se cumple.',
    'ej.noentra.titulo': '¿Y si no entra ni una vez?',
    'ej.noentra.consigna': '¿Qué se muestra?',
    'ej.noentra.trampa': '«Mientras» comprueba antes de entrar. Con n ← 5 la condición falla de entrada y el cuerpo no corre ni una vez.',
    'ej.cuenta.titulo': 'Cuenta atrás',
    'ej.cuenta.consigna': '¿Qué números se muestran?',
    'ej.cuenta.trampa': 'Con «> 0» el 0 no entra. Si querías incluirlo habría que escribir «>= 0».',
    'ej.suma.titulo': 'La suma de 1 a 4',
    'ej.suma.consigna': '¿Cuánto vale total al final?',
    'ej.suma.trampa': 'En «para … hasta 4», el 4 también cuenta: son cuatro vueltas, no tres.',
    'ej.ktope.titulo': 'Una constante como límite',
    'ej.ktope.consigna': '¿Qué números se muestran?',
    'ej.ktope.trampa': 'TOPE no cambia en ningún momento; lo que cambia es n. La condición «n <= TOPE» deja de cumplirse cuando n llega a 4.',
    'ej.pares.titulo': 'Solo los pares',
    'ej.pares.consigna': '¿Qué números se muestran?',

  primaria: {
    'tema.variables': 'Cajas con nombre', 'tema.constantes': 'Cajas que no cambian', 'tema.repaso1': 'Cajas de todo tipo', 'tema.condicionales': 'Decidir', 'tema.bucles': 'Repetir', 'tema.repaso2': 'Decide y repite', 'tema.tipos': 'Números y textos', 'tema.entrada': 'Pedir datos', 'tema.segun': 'Elegir entre casos', 'tema.repetir': 'Repetir hasta que…',
    'subtitulo': 'Construye, predice y observa cómo lo hace la máquina. Aquí los errores hablan.',
    'np.titulo': '¿Por qué una flecha ←?',
    'np.texto': 'Para meter algo en una caja usamos una flecha: <code>edad ← 7</code> se lee «mete el 7 en la caja edad» y la flecha apunta hacia la caja. El signo <code>=</code> lo guardamos para <b>preguntar</b> si dos cosas son iguales. Cuando programes con lenguajes de verdad, verás que muchos usan <code>=</code> para meter cosas en la caja. Aquí la flecha nos ayuda a no confundirlo con mates.',
    'ac.titulo': '¿caja o "caja"?',
    'ac.texto': 'Fíjate en cómo se ven. <span class="v">edad</span> es una caja: una palabra con cosas dentro. <span class="n">7</span> es un número. <span class="s">"edad"</span>, entre comillas, es un texto: la palabra escrita tal cual, sin nada dentro. Si escribes <code>mostrar edad</code>, la pantalla enseña lo que hay dentro de la caja. Si escribes <code>mostrar "edad"</code>, enseña la palabra edad.',
    'gl.constantes.titulo': '¿Qué es una constante?',
    'gl.tipos.titulo': '¿Números o textos?',
    'gl.tipos.texto': 'Las cajas pueden guardar cosas distintas. Un <b>número</b> (<code>7</code>) sirve para hacer cuentas. Un <b>texto</b> (<code>"7"</code>, entre comillas) es una palabra o un trozo de frase: se puede unir con otros textos, pero no sirve para hacer cuentas. Aunque <code>7</code> y <code>"7"</code> se vean parecidos, no son lo mismo: con <code>+</code>, los números se suman y los textos se unen.',
    'gl.entrada.titulo': '¿Qué es pedir un dato?',
    'gl.entrada.texto': 'A veces el programa necesita que la persona le diga algo. <code>leer nombre</code> hace que el programa espere lo que la persona escribe y lo guarde en la caja <code>nombre</code>. Lo que llega es siempre un <b>texto</b>, aunque sean cifras. Para hacer cuentas con ello hay que convertirlo en número con <code>numero(...)</code>. Encima del programa verás lo que escribe la persona.',
    'gl.segun.titulo': '¿Qué es un «segun»?',
    'gl.segun.texto': 'A veces hay muchas opciones y solo una es la buena. <code>segun dia hacer</code> mira lo que hay en la caja <code>dia</code> y hace lo del <b>primer</b> <code>caso</code> que coincide, y nada más. Un caso puede tener varios valores: <code>caso 6, 7 entonces</code>. Si ninguno coincide, se hace lo del <code>sino</code>.',
    'gl.repetir.titulo': '¿Qué es «repetir … hasta»?',
    'gl.repetir.texto': 'Con <code>repetir … hasta</code>, el programa <b>primero hace</b> lo de dentro y <b>después pregunta</b> si ya puede parar. Si la respuesta es «verdadero», se acaba; si es «falso», lo repite. Por eso lo de dentro se hace <b>por lo menos una vez</b>. Ojo: aquí la condición dice cuándo <b>parar</b>; en «mientras» dice cuándo seguir.',
    'gl.repaso1.texto': 'Aquí se juntan las cajas que cambian y las que no. Sigue cada caja línea a línea: cuál cambia, cuál se queda igual y cuál copia el número de otra.',
    'gl.repaso2.texto': 'Aquí se juntan las decisiones y las repeticiones. Sigue el programa vuelta a vuelta: en cada vuelta, el «si» hace una pregunta y se hace una cosa u otra.',
    'gl.constantes.texto': 'A veces hay un número que nunca debe cambiar, como los días de la semana. Para eso sirve una <b>constante</b>: una caja que guarda su número una sola vez y ya no se le puede cambiar. Se crea con <code>constante DIAS ← 7</code> y después se usa como cualquier caja. Si el programa intenta meterle otro número, se para con un error.',
    'gl.variables.titulo': '¿Qué es una caja?',
    'gl.variables.texto': 'Una caja es una palabra a la que puedes meter cosas dentro: un número o un texto. Si escribes <code>edad ← 7</code>, la palabra <span class="v">edad</span> se convierte en una caja que guarda un 7. Después puedes <b>cambiar lo que hay dentro</b> metiendo otra cosa: la caja se queda con lo último que metiste.',
    'gl.condicionales.titulo': '¿Qué es un condicional?',
    'gl.condicionales.texto': 'A veces el programa tiene que <b>decidir</b>. Con <code>si</code> le haces una pregunta: si la respuesta es «sí, es verdad», hace lo que va dentro; si no, hace lo que va después de <code>sino</code>. Es como decir: «si llueve, coge el paraguas; si no, ponte las gafas de sol». Solo se hace una de las dos cosas, nunca las dos.',
    'gl.bucles.titulo': '¿Qué es un bucle?',
    'gl.bucles.texto': 'Un bucle es una repetición: el programa hace lo mismo varias veces sin que tengas que escribirlo una y otra vez. <code>mientras</code> repite mientras algo siga siendo verdad. <code>para</code> repite contando, de un número a otro. Cuidado: dentro tiene que haber algo que haga que alguna vez deje de ser verdad, o no acaba nunca.',
    'pred.pregunta': '¿Qué muestra la pantalla?',

    'cons.fb.otro': 'Lo has hecho en otro orden, y también vale.',
    'cons.cambiar.trampa': 'Hace falta una caja de ayuda (aux): guarda el valor anterior antes de pisarlo. Con solo «a ← b» y «b ← a» los dos acaban valiendo lo mismo.',
    'cons.doble.pista.suma': '«x ← x + 2» le añade 2 a la caja x, pero no duplica su número: con 5 sale 7, no 10. Para duplicar hay que multiplicar por 2.',
    'cons.cuenta.pista.sube': 'Con «n ← n + 1», el número de la caja n sube en cada vuelta y nunca llega a 0: la repetición no acaba nunca. Para contar hacia atrás hay que restar 1.',
    'cons.cuenta.pista.orden': 'Si le restas 1 a n antes de mostrarla, la pantalla muestra el número ya rebajado: sale 2 1 0. Para que salga 3 2 1, primero se muestra n y después se le resta 1.',
    'cons.vueltas.pista.baja': 'Con «n ← n - 1», el número de la caja n baja en cada vuelta y siempre es menor que 4: la repetición no acaba nunca. Para llegar al 4 hay que sumar 1.',
    'cons.vueltas.pista.limite': 'Con «n <= 4» el 4 también entra: la repetición da una vuelta más y se muestra el 4. Para que se pare en el 3, la condición tiene que ser «n < 4».',
    'cons.suma.pista.pisa': '«total ← i» cambia lo que hay en la caja total por el número de i en cada vuelta, así que al final solo queda el último (4). Para ir sumando hay que añadir a lo que ya había: «total ← total + i».',
    'cons.suma.pista.dentro': 'Si «mostrar total» está dentro de la repetición, la pantalla muestra la suma en cada vuelta (1 3 6 10). Para que salga solo el resultado final, va después del «fin».',
    'cons.cambiar.pista.pisa': 'Mira las cajas al final: a y b guardan lo mismo, así que una de las copias pisó un número antes de guardarlo. Cuando metes algo en una caja, lo que había dentro se pierde. Guarda primero uno de los números en la caja aux, y luego usa aux para devolverlo.',
    'cons.ayuda.puesta': 'Te he colocado la siguiente línea que toca. Lo que estaba mal puesto vuelve a la caja de piezas.',
    'ej.kuso.consigna': '¿Qué número se muestra en pantalla?',
    'ej.kuso.trampa': 'DIAS es una constante: siempre guarda el 7. Se usa igual que otra caja en las cuentas, pero nadie le puede cambiar el número.',
    'ej.kcambia.consigna': '¿Qué números muestra la pantalla? Si el programa se para por un error, cuenta solo lo que se mostró antes.',
    'ej.kcambia.trampa': 'Una constante no se puede cambiar. Cuando el programa lo intenta, se para con un error y ya no sigue: por eso no se muestra el 20.',
    'ej.ktope.titulo': 'Una constante como tope',
    'ej.ktope.consigna': '¿Qué números muestra la pantalla?',
    'ej.ktope.trampa': 'TOPE siempre vale 3. Lo que cambia es n, que va subiendo hasta que ya no es menor o igual que TOPE.',
    'ej.rpan.titulo': 'La cuenta del pan',
    'ej.tsumar.consigna': '¿Qué muestra la pantalla?',
    'ej.tsumar.trampa': 'Con números, «+» suma: 2 + 3 es 5. Con textos (entre comillas), «+» los une: «"2" + "3"» es 23. La pantalla no muestra las comillas, pero el programa sí las tiene en cuenta.',
    'ej.tsaludo.titulo': 'Unir con una caja',
    'ej.tsaludo.consigna': '¿Qué muestra la pantalla?',
    'ej.tsaludo.trampa': 'Un texto se une con lo que hay dentro de la caja: «Hola » + nombre da «Hola Ana». Un número unido a un texto se convierte en texto: «Tienes » + edad da «Tienes 12». Los espacios dentro de las comillas también cuentan.',
    'ej.ttotal.consigna': '¿Qué muestra la pantalla?',
    'ej.ttotal.trampa': 'La cuenta se hace de izquierda a derecha: «"Total: " + a» ya es un texto, y a ese texto se le une b, así que sale «Total: 35». Con paréntesis, primero se hace a + b = 8 y después se une al texto.',
    'ej.tcomillas.consigna': '¿Qué muestra la pantalla?',
    'ej.tcomillas.trampa': 'El 7 es un número y «"7"» es un texto. Se parecen, pero no son lo mismo, así que la pregunta «a = b» tiene la respuesta «falso» y se hace lo del «sino».',
    'ej.tnocalcula.consigna': '¿Qué muestra la pantalla? Si el programa se para por un error, cuenta solo lo que se mostró antes.',
    'ej.tnocalcula.trampa': 'Con un texto no se pueden hacer cuentas: «"ab" * 2» es un error y el programa se para en esa línea. El 9 no llega a mostrarse.',
    'ej.esaludo.consigna': '¿Qué muestra la pantalla?',
    'ej.esaludo.trampa': '«leer nombre» guarda en la caja lo que escribe la persona, y «Hola » + nombre une los dos textos: sale «Hola Ana». Con otro nombre saldría otro saludo, sin cambiar el programa.',
    'ej.eorden.consigna': '¿Qué muestra la pantalla?',
    'ej.eorden.trampa': 'Cada «leer» toma el siguiente dato, en el orden en que la persona los escribió: la caja a guarda el 3 y la caja b guarda el 4. Primero se muestra b.',
    'ej.esumatxt.consigna': '¿Qué muestra la pantalla?',
    'ej.esumatxt.trampa': 'Lo que escribe la persona llega siempre como texto, aunque sean cifras: «"2" + "3"» une los dos textos y sale «23», no 5.',
    'ej.enumero.consigna': '¿Qué muestra la pantalla?',
    'ej.enumero.trampa': '«numero(a)» convierte el texto «2» en el número 2, y entonces «+» sí suma: sale 5. Sin la conversión saldría «23».',
    'ej.ecalor.consigna': '¿Qué muestra la pantalla?',
    'ej.ecalor.trampa': 'Con la conversión, «numero(t)» es el número 25, y «25 > 20» es verdadero: se muestra «calor».',
    'ej.ecompara.consigna': '¿Qué muestra la pantalla? Si el programa se para por un error, cuenta solo lo que se mostró antes.',
    'ej.ecompara.trampa': 'El dato llega como texto, y un texto no se puede comparar con el número 20: el programa se para en el «si». Antes hay que convertirlo: «numero(t) > 20».',
    'ej.sdia.consigna': '¿Qué muestra la pantalla?',
    'ej.sdia.trampa': 'El «segun» mira lo que hay en la caja dia (2) y lo compara con cada caso, de arriba abajo. Hace solo el primero que coincide («martes») y ahí se acaba: los casos de después no se hacen.',
    'ej.slista.consigna': '¿Qué muestra la pantalla?',
    'ej.slista.trampa': 'Un caso puede tener varios valores separados por comas: «caso 6, 7» vale si la caja dia guarda un 6 o un 7. Como guarda un 7, se hace ese caso y el «sino» no.',
    'ej.ssin.consigna': '¿Qué muestra la pantalla?',
    'ej.ssin.trampa': 'Ningún caso coincide con el 4 y no hay «sino»: el «segun» no hace nada y el programa sigue después de su «fin».',
    'ej.stexto.consigna': '¿Qué muestra la pantalla?',
    'ej.stexto.trampa': 'Con textos, el caso tiene que ser igual de verdad: «"verde"» coincide con «"verde"». Las mayúsculas cuentan: «"Verde"» no sería igual.',
    'ej.hcuenta.consigna': '¿Qué muestra la pantalla?',
    'ej.hcuenta.trampa': 'El «repetir» hace lo de dentro y después pregunta «n > 3». Mientras la respuesta sea «falso», lo repite: salen 1, 2 y 3, y cuando n llega a 4 la respuesta es «verdadero» y se acaba. La condición dice cuándo parar.',
    'ej.halmenos.consigna': '¿Qué muestra la pantalla?',
    'ej.halmenos.trampa': 'Lo de dentro se hace antes de preguntar nada: la pantalla muestra el 5 aunque n ya cumple «n > 3». Solo después se ve que hay que parar. Con «mientras» no se habría hecho ninguna vez.',
    'ej.hatras.consigna': '¿Qué muestra la pantalla?',
    'ej.hatras.trampa': 'Primero se muestra y después se resta 1; la pregunta «vidas = 0» se hace al restar, así que el 0 nunca llega a mostrarse: sale 3 2 1.',
    'ej.hcompara.consigna': '¿Qué muestra la pantalla?',
    'ej.hcompara.trampa': 'El «mientras» muestra 1 y 2 y acaba con n = 3. El «repetir» hace lo de dentro una vez sin preguntar: muestra el 3, y como n vale 4 y «n > 4» todavía es falso, repite y muestra el 4; con n = 5 se acaba.',
    'ej.hsuma.consigna': '¿Qué muestra la pantalla?',
    'ej.hsuma.trampa': 'En cada vuelta se suma i al total y después se pregunta «total >= 6»: el total va valiendo 1, 3 y 6. Al llegar a 6 la respuesta es «verdadero», se acaba y se muestra 6.',
    'ej.rpan.consigna': '¿Qué número se muestra en pantalla?',
    'ej.rpan.trampa': 'La caja total guardó 2 * 4 cuando panes valía 2. Si luego panes cambia, total se queda como estaba: una caja guarda una foto, no un atajo. Y PRECIO no cambia mientras el programa se ejecuta.',
    'ej.rvidas.consigna': '¿Qué números muestra la pantalla?',
    'ej.rvidas.trampa': 'vidas copia el 3 que hay en MAX y luego baja a 2. MAX sigue en 3: una constante no cambia mientras el programa se ejecuta.',
    'ej.rmayores.consigna': '¿Qué números muestra la pantalla?',
    'ej.rmayores.trampa': 'La repetición va del 1 al 5, con el 5 incluido, y el «si» solo deja pasar los números mayores que 3: el 4 y el 5.',
    'ej.rsuma.titulo': 'Sumar o restar según el caso',
    'ej.rsuma.consigna': '¿Qué número se muestra al final?',
    'ej.rsuma.trampa': 'En cada vuelta se hace una sola cosa: los números menores que 3 se suman (1 + 2 = 3) y los otros restan 1: 3 - 1 - 1 = 1.',
    'ej.kmezcla.consigna': '¿Qué número se muestra en pantalla?',
    'ej.kmezcla.trampa': 'BASE siempre guarda el 5. La caja extra cambió de 2 a 3, así que la cuenta usa lo que hay ahora: 5 + 3.',
    'ej.intercambio.consigna': 'La pantalla muestra a y luego b. ¿Qué números salen?',
    'ej.intercambio.trampa': 'Después de «a ← b», las dos cajas valen lo mismo: el 3 que había en a se perdió. Para cambiarlas de sitio hace falta una caja de ayuda.',
    'ej.precio.trampa': 'La caja total se calculó con el precio de ANTES (10 × 3). Cambiar la caja precio después no cambia el valor de total: una caja guarda una foto, no un atajo.',
    'ej.justo.consigna': '¿Qué palabra muestra la pantalla?',
    'ej.justo.trampa': 'Con «>=» el 20 también cuenta; con «>» no. Los números que caen justo en el borde son los que más engañan.',
    'ej.unootro.consigna': '¿Qué palabras muestra la pantalla, y en qué orden?',
    'ej.noentra.consigna': '¿Qué muestra la pantalla?',
    'ej.noentra.trampa': '«Mientras» mira antes de entrar. Como n vale 5 desde el principio, la condición no es verdad ni a la primera: lo de dentro no se hace ni una vez.',
    'cons.fb.casi': 'Tu programa muestra lo que se pide, pero no usa las piezas que tocaban: alguna sobra o falta.',

    'err.const-existe': 'La caja «{n}» ya existe: elige otro nombre para la constante.',

    'cons.crear.titulo': 'Crea una caja con nombre',
    'cons.crear.consigna': 'Crea una caja que se llame edad y mete dentro el número 7.',
    'cons.crear.trampa': 'Al escribir «edad ← 7», la palabra «edad» se convierte en una caja con un 7 dentro. La flecha va hacia la caja: de lo que metes a donde lo metes.',
    'cons.caja.titulo': 'Guarda cosas en cajas y úsalas',
    'cons.kcrear.consigna': 'Crea una constante llamada DIAS que valga 7 y haz que la pantalla la muestre.',
    'cons.kcrear.trampa': 'Una constante es una caja que se crea con la palabra «constante» y guarda su número una sola vez.',
    'cons.kpaquetes.titulo': 'Una constante en una cuenta',
    'cons.kpaquetes.consigna': 'Cada paquete trae 6 huevos. Crea la constante HUEVOS con el 6 y calcula cuántos huevos hay en 3 paquetes: tiene que salir 18.',
    'cons.kpaquetes.trampa': 'Ponerle nombre al 6 sirve para no repetirlo en cada cuenta. Si un día los paquetes traen otra cantidad, se escribe un número distinto una sola vez, al crear la constante.',
    'cons.caja.consigna': 'Mete el 7 en la caja edad y haz que la pantalla muestre lo que hay dentro de la caja.',
    'cons.doble.titulo': 'Duplica el valor de una caja',
    'cons.cambiar.titulo': 'Intercambia valores en cajas',
    'cons.doble.consigna': 'La caja x guarda un 5. Haz que valga el doble y que la pantalla lo muestre: tiene que salir 10.',
    'cons.cambiar.consigna': 'La caja a guarda un 3 y la b un 5. Intercambia sus valores y muestra a y luego b: tiene que salir 5 3.',
    'cons.clima.consigna': 'Si hay 25 grados o más, muestra «calor»; si no, muestra «frío». Hoy hay 18 grados.',
    'cons.tarmar.consigna': 'Guarda el texto «Ana» en la caja nombre y haz que la pantalla muestre «Hola Ana», uniendo «Hola » con la caja nombre.',
    'cons.tarmar.trampa': 'Un texto va entre comillas y una caja no: con «"nombre"» saldría la palabra, no lo que hay dentro de la caja. Y sin el espacio dentro de las comillas saldría «HolaAna».',
    'cons.tsumatxt.consigna': 'Guarda un 3 en la caja a y un 5 en la caja b. Haz que la pantalla muestre «Total: 8»: el texto «Total: » seguido de la suma de a y b.',
    'cons.tsumatxt.trampa': 'La suma va entre paréntesis para que se haga antes de unirse al texto. Sin ellos se uniría un 3 y después un 5, y saldría «Total: 35».',
    'cons.esaluda.consigna': 'Lee el nombre que escribe la persona y haz que la pantalla muestre «Hola » seguido de ese nombre.',
    'cons.esaluda.trampa': 'El nombre no está escrito en el programa: se lee, y así el saludo vale para cualquier nombre. Entre comillas, «"nombre"» sería la palabra, no lo que escribió la persona.',
    'cons.edoble.consigna': 'Lee un número que escribe la persona y haz que la pantalla muestre su doble.',
    'cons.edoble.trampa': 'El dato llega como texto: hay que convertirlo con numero(...) antes de multiplicar. Con «n + n» saldría el texto repetido (44), no 8.',
    'cons.sdiasem.consigna': 'Guarda 3 en la caja dia. Con un «segun»: si dia es 1, la pantalla muestra «lunes»; si es 3, «miércoles»; y en cualquier otro caso, «otro». Tiene que salir miércoles.',
    'cons.sdiasem.trampa': 'Cada caso empieza con «caso … entonces», el «sino» recoge todo lo demás y todo se cierra con un solo «fin».',
    'cons.smenu.consigna': 'Guarda 6 en la caja dia. Con un «segun», haz que la pantalla muestre «descanso» si dia es 6 o 7 y «trabajo» en cualquier otro caso: tiene que salir descanso.',
    'cons.smenu.trampa': 'Un caso puede tener varios valores separados por comas. Con «caso 6» a secas, el 7 caería en el «sino» y saldría «trabajo».',
    'cons.hcontar.consigna': 'Con un «repetir … hasta», haz que la pantalla muestre 1, 2, 3: tiene que salir 1 2 3.',
    'cons.hcontar.trampa': 'La condición del «hasta» dice cuándo parar: con «n > 3» se para al llegar a 4, después de mostrar el 3. Con «n < 3» pararía enseguida.',
    'cons.hsumar.consigna': 'Suma 1, 2, 3… con un «repetir … hasta» y para en cuanto el total llegue a 6 o más. Después haz que la pantalla muestre el total: tiene que salir 6.',
    'cons.hsumar.trampa': 'Dentro se suma i al total y se sube i; el «hasta total >= 6» decide cuándo parar. El «mostrar total» va después, fuera de la repetición.',
    'cons.rtotal.titulo': 'La cuenta del pan',
    'cons.rtotal.consigna': 'Crea la constante PRECIO con el 4, guarda un 3 en panes y guarda en total lo que cuestan los panes. Muestra total: tiene que salir 12.',
    'cons.rtotal.trampa': 'PRECIO se crea una sola vez, y total se calcula con ella y con panes. Si un día cambia el precio, solo hay que escribir otro número al crear la constante.',
    'cons.rrestar.consigna': 'Crea la constante MAX con el 3, guarda MAX en la caja vidas, réstale 1 a vidas y muestra vidas y MAX: tiene que salir 2 3.',
    'cons.rrestar.trampa': 'Se le resta a la caja vidas, no a MAX: una constante no se puede cambiar, y el programa se pararía con un error.',
    'cons.rmayor.consigna': 'Con una repetición del 1 al 5, muestra solo los números mayores que 3: tiene que salir 4 5.',
    'cons.rmayor.trampa': 'La decisión va dentro de la repetición, y cada una necesita su propio «fin». Con «>= 3» también saldría el 3.',
    'cons.rpuente.consigna': 'Crea la constante TOPE con el 3. Con una repetición del 1 al TOPE, muestra cada número, pero en el último muestra «¡ya!»: tiene que salir 1 2 ¡ya!',
    'cons.rpuente.trampa': 'Aquí se junta todo: una constante, una repetición y una decisión. El «si» compara con TOPE, así que si un día cambias el 3, el aviso sigue saliendo en el último número.',
    'cons.justo.consigna': 'Si hay 20 grados o más, muestra «calor»; si no, muestra «frío». Hoy hay 20 grados.',
    'cons.justo.trampa': 'Con «>=» el 20 también cuenta; con «>» no. Los números que caen justo en el borde son los que más engañan.',
    'cons.unootro.consigna': 'Hoy hay 25 grados. Si hay más de 20, muestra «calor»; si no, muestra «frío». Después, pase lo que pase, muestra «listo».',
    'cons.unootro.trampa': 'El «sino» solo se hace si el «si» no se cumple. «Listo» va después del «fin»: se muestra siempre.',
    'cons.vueltas.consigna': 'Con una repetición «mientras», muestra 1, 2, 3.',
    'cons.vueltas.trampa': 'Con «<» el 4 se queda fuera: cuando n llega a 4, la condición ya no se cumple. Y dentro hay que subir n de uno en uno, o el programa no acabaría nunca.',
    'cons.ktope.titulo': 'Una constante como tope',
    'cons.ktope.consigna': 'Crea la constante TOPE con el 3 y haz una repetición que muestre los números del 1 al TOPE: tiene que salir 1 2 3.',

/* Pestañas de la pantalla Elegir: cada bloque agrupa temas y se cierra con su repaso. Para añadir un bloque (o mover un
   tema de sitio) basta editar esto y dar nombre a «bloque.<id>» en TEXTOS. Con un solo bloque no se muestran pestañas. */
const BLOQUES = [
  { id: 'cajas',   temas: ['variables', 'constantes', 'repaso1'] },
  { id: 'decidir', temas: ['condicionales', 'segun'] },
  { id: 'repetir', temas: ['bucles', 'repetir', 'repaso2'] },
  { id: 'tipos',   temas: ['tipos', 'entrada'] }
];

/* t('clave', {huecos}): registro activo → base. Si falta en ambos, se ve ⟦clave⟧ y avisa. */
let REG = 'eso';
function t(clave, vars) {
  const d = TEXTOS[LANG];
  let s = d[REG] && d[REG][clave];
  if (s === undefined) s = d[BASE][clave];
  if (s === undefined) { console.warn('Falta el texto: ' + clave); return '⟦' + clave + '⟧'; }
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : s;
}

<!-- ═══════════════════════ JUEGO ═══════════════════════
     Reglas puras de la reserva de ayuditas (sin DOM, para poder probarlas) y banco de preguntas.
     Cada nivel tiene su reserva. Se recarga con XP, con el tiempo o acertando una pregunta.
     Textos de las preguntas: TEXTOS q.<id>.{p,ok,x1,x2,e}  (ok = correcta, x1/x2 = trampas, e = explicacion). -->
<script id="juego">
const AY = {
  MAX: 5,                      // casillas de la reserva
  XP_POR: 20,                  // XP ganados que recargan una casilla
  MS_POR: 4 * 60 * 1000,       // una casilla cada 4 minutos (red de seguridad: nunca hay bloqueo total)
  nuevo: ahora => ({ n: 5, t: ahora, xp: 0 }),
  recargarTiempo(e, ahora) {
    if (e.n >= AY.MAX) { e.t = ahora; return e; }
    const k = Math.floor((ahora - e.t) / AY.MS_POR);
    if (k > 0) { e.n = Math.min(AY.MAX, e.n + k); e.t = e.n >= AY.MAX ? ahora : e.t + k * AY.MS_POR; }
    return e;
  },
  gastar(e, ahora) { if (e.n >= AY.MAX) e.t = ahora; e.n = Math.max(0, e.n - 1); return e; },
  ganarXP(e, xp, ahora) {
    e.xp += xp;
    while (e.xp >= AY.XP_POR && e.n < AY.MAX) { e.n++; e.xp -= AY.XP_POR; if (e.n >= AY.MAX) e.t = ahora; }
    if (e.n >= AY.MAX) e.xp = 0;
    return e;
  },
  recargaQuiz(e, ahora) { if (e.n < AY.MAX) { e.n++; if (e.n >= AY.MAX) { e.t = ahora; e.xp = 0; } } return e; },
  proxima(e, ahora) { return { xp: AY.XP_POR - e.xp, ms: Math.max(0, AY.MS_POR - (ahora - e.t)) }; }
};

const PREGUNTAS = [
  { id: 'v1', tema: 'variables' },
  { id: 'v2', tema: 'variables', codigo: 'x ← 3\nx ← 8' },
  { id: 'v3', tema: 'variables', codigo: 'edad ← 7\nmostrar "edad"' },
  { id: 'k1', tema: 'constantes' },
  { id: 'k2', tema: 'constantes', codigo: 'constante MAXIMO ← 10\nmostrar MAXIMO' },
  { id: 'k3', tema: 'constantes' },
  { id: 'c1', tema: 'condicionales' },
  { id: 'c2', tema: 'condicionales' },
  { id: 'c3', tema: 'condicionales', codigo: 't ← 20\nsi t > 20 entonces\n  mostrar "calor"\nfin' },
  { id: 'r1', tema: 'repetir' },
  { id: 'r2', tema: 'repetir', codigo: 'n ← 5\nrepetir\n  mostrar n\n  n ← n + 1\nhasta n > 3' },
  { id: 'r3', tema: 'repetir' },
  { id: 's1', tema: 'segun' },
  { id: 's2', tema: 'segun', codigo: 'n ← 2\nsegun n hacer\n  caso 1 entonces\n    mostrar "a"\n  caso 2 entonces\n    mostrar "b"\nfin' },
  { id: 's3', tema: 'segun' },
  { id: 'b1', tema: 'bucles' },
  { id: 'b2', tema: 'bucles', codigo: 'n ← 5\nmientras n < 3 hacer\n  mostrar n\n  n ← n + 1\nfin' },
  { id: 'b3', tema: 'bucles' },
  { id: 't1', tema: 'tipos' },
  { id: 't2', tema: 'tipos', codigo: 'mostrar "2" + "3"' },
  { id: 't3', tema: 'tipos', codigo: 'a ← 3\nb ← 5\nmostrar "Total: " + a + b' },
  { id: 'e1', tema: 'entrada' },
  { id: 'e2', tema: 'entrada', codigo: 'leer n\nmostrar n + n', entrada: ['4'] },
  { id: 'e3', tema: 'entrada' }
];
/* Elige la pregunta: la primera sin responder del tema que se esta viendo; si no hay, de otro tema. */
function elegirPregunta(tema, respondidas) {
  const pend = PREGUNTAS.filter(q => !respondidas.includes(q.id));
  return pend.find(q => q.tema === tema) || pend[0] || null;
}
</script>

<!-- ═══════════════════════ KORU ═══════════════════════
     Puente hacia una IA (o hacia quien enseña), igual que el KORU de ARKINESIS: la herramienta expone un
     ESTADO estructurado con la misma forma (module, simulation, inputs, outputs, activeInsights,
     activeConnections) y de el salen prompts con contexto que alguien COPIA y lleva donde quiera.
     Nada se envia a ningun sitio.

     ESTA CAPA ES SILENCIOSA: no hay boton ni panel. Cuando llegue la interfaz solo tiene que llamar a
         window.exportState()                      → el estado del reto que hay abierto
         KORU.prompt('explicar'|'siguiente'|'libre', estado, pregunta)   → texto listo para copiar
     Es codigo puro (sin DOM): la app le pasa una «instantanea» del momento y el la convierte.
     Las frases viven en TEXTOS (claves koru.*), como todo lo demas.
     Nota: el diagnostico (causas de un malentendido) es lo que hace valioso este estado: es el contexto que
     una IA casi nunca tiene. No es una funcion para ninos: la interfaz tendra que mantenerla escondida. -->
<script id="koru">
const KORU = (function () {
  'use strict';
  const NIVELES = { primaria: 'primaria', eso: 'ESO', bach: 'bachillerato' };
  const campo = (label, value, unit) => ({ label, value, unit: unit || '' });
  // la salida de un programa como texto («3 2 1»); null si el programa no se puede ejecutar
  function salidaDe(codigo, entrada) {
    if (!codigo) return null;
    try { const r = MOTOR.correr(codigo, null, entrada); return r.error ? null : r.salida.map(String).join(' '); } catch (_) { return null; }
  }
  const unaLinea = a => (Array.isArray(a) ? a : [a]).map(String).join(' ');

  // instantanea → estado con la forma de ARKINESIS
  function estado(s) {
    if (!s) return null;
    const u = s.ultimo || null, pred = s.tipo === 'predecir';
    const inputs = { nivel: campo(t('koru.l.nivel'), s.nivel), modo: campo(t('koru.l.modo'), s.modo) };
    if (s.codigo) inputs.codigo = campo(t('koru.l.codigo'), s.codigo);
    if (s.entrada && s.entrada.length) inputs.entrada = campo(t('koru.l.entrada'), s.entrada.join(' · '));
    if (s.montaje && s.montaje.length) inputs.montaje = campo(t('koru.l.montaje'), s.montaje.join('\n'));
    if (u && u.respuesta !== undefined) inputs.respuesta = campo(t('koru.l.respuesta'), u.respuesta.trim() || t('koru.nada'));
    const outputs = {};
    const esperado = salidaDe(pred ? s.codigo : s.solucion, s.entrada);
    if (esperado !== null) outputs.esperado = campo(t('koru.l.esperado'), esperado || t('koru.nada'));
    if (u && u.mio !== undefined) outputs.obtenido = campo(t('koru.l.obtenido'), unaLinea(u.mio) || t('koru.nada'));
    if (u) outputs.correcta = campo(t('koru.l.correcta'), !!(u.correcta || u.estado === 'ok'));
    outputs.fallos = campo(t('koru.l.fallos'), s.fallos || 0);
    outputs.ayudas = campo(t('koru.l.ayudas'), s.ayudas || 0);
    if (s.xp !== undefined) outputs.xp = campo(t('koru.l.xp'), s.xp, 'XP');
    const activeInsights = [];
    if (u && u.causas) u.causas.forEach(id => activeInsights.push(t('koru.idea', { corto: t('mod.' + id + '.corto') })));
    if (u && u.estado && u.estado !== 'ok') activeInsights.push(t('koru.estado.' + u.estado));
    if (s.modelo) activeInsights.push(t('koru.mirando', { corto: t('mod.' + s.modelo + '.corto') }));
    return { module: 'informatica', simulation: s.titulo, inputs, outputs, activeInsights, activeConnections: [] };
  }

  // estado → texto para pegar en una IA. situaciones: explicar | siguiente | libre (esta pide `pregunta`)
  const SITUACIONES = ['explicar', 'siguiente', 'libre'];
  function prompt(situacion, st, pregunta) {
    if (!SITUACIONES.includes(situacion)) throw new Error('KORU.prompt: situación desconocida «' + situacion + '»');
    if (!st) throw new Error('KORU.prompt: no hay estado (¿hay un reto abierto?)');
    if (situacion === 'libre' && !String(pregunta || '').trim()) throw new Error('KORU.prompt: falta la pregunta');
    const v = k => (st.inputs[k] ? st.inputs[k].value : null), o = k => (st.outputs[k] ? st.outputs[k].value : null);
    const nivel = NIVELES[v('nivel')] || v('nivel');
    const linea = (k, valor) => t('koru.l.' + k) + ': ' + valor;
    const bloque = (k, codigo) => t('koru.l.' + k) + ':\n```\n' + codigo + '\n```';
    const partes = [t('koru.rol', { nivel }), t('koru.contexto'), '',
      t('koru.reto', { titulo: st.simulation, modo: t('koru.modo.' + v('modo')) })];
    if (v('codigo')) partes.push(bloque('codigo', v('codigo')));
    if (v('montaje')) partes.push(bloque('montaje', v('montaje')));
    if (v('respuesta') !== null) partes.push(linea('respuesta', v('respuesta')));
    if (o('obtenido') !== null) partes.push(linea('obtenido', o('obtenido')));
    if (o('esperado') !== null) partes.push(linea('esperado', o('esperado')));
    partes.push(linea('fallos', o('fallos')) + ' · ' + linea('ayudas', o('ayudas')));
    if (st.activeInsights.length) partes.push('', t('koru.diag'), ...st.activeInsights.map(x => '- ' + x));
    partes.push('', t('koru.pide.' + situacion, { pregunta: String(pregunta || '').trim() }));
    return partes.join('\n');
  }
  return { estado, prompt, SITUACIONES };
})();
</script>

<!-- ═══════════════════════ APP ═══════════════════════ -->
<script id="app">
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const CLAVE_XP = 'hpk-pseudocoder-xp', CLAVE_NIVEL = 'hpk-pseudocoder-nivel';
  // E: estado de la interfaz.  C: el reto de construir que hay abierto.
  const E = { modo: 'construir', lista: [], listaC: [], i: 0, c: 0, paso: -1, modelo: '', traza: null,
              xp: {}, fallosP: 0, ayudaP: false, timer: null, dormir: null, codigoMirar: null, lectura: false, ultimo: null };
  const C = { id: null, bloques: new Map(), banco: [], montaje: [], malLinea: -1, ayudas: 0, fallos: 0 };
  try { Object.assign(E.xp, JSON.parse(localStorage.getItem(CLAVE_XP) || '{}')); } catch (_) {}
  const guardar = () => { try { localStorage.setItem(CLAVE_XP, JSON.stringify(E.xp)); } catch (_) {} };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ej = () => E.lista[E.i], ret = () => E.listaC[E.c];
  const tej = campo => t('ej.' + ej().id + '.' + campo);
  const tcon = campo => t('cons.' + ret().id + '.' + campo);
  // «Reto» = lo que se esta mirando viene de Construir (o es el programa montado por la persona)
  const esReto = () => E.modo === 'construir' || (E.modo === 'mirar' && E.codigoMirar !== null);
  const codigoActual = () => E.codigoMirar !== null ? E.codigoMirar : ej().codigo;
  const anunciar = (clave, vars) => { $('#anuncio').textContent = t(clave, vars); };

  // ── XP: cada nivel es una partida distinta (la clave lleva el nivel) ──
  const claveXP = (modo, id) => REG + ':' + modo + ':' + id;
  const XP_PRED = 10, XP_CONS = 15;
  // base menos 2 por fallo y 5 por ayudita, sin bajar de un tercio de la base
  const puntos = (base, fallos, ayudas) => Math.max(Math.ceil(base / 3), base - 2 * fallos - 5 * ayudas);
  function otorgar(modo, id, base, fallos, ayudas) {
    const k = claveXP(modo, id), nuevo = puntos(base, fallos, ayudas), antes = E.xp[k] || 0;
    if (nuevo > antes) { E.xp[k] = nuevo; guardar(); }
    const ganado = Math.max(0, nuevo - antes);
    if (ganado > 0) ayGanarXP(ganado);
    pintarXP();
    return ganado;
  }
  const xpHtml = g => '<div class="xp-gana">' + esc(g > 0 ? t('xp.ganas', { n: g }) : t('xp.ya')) + '</div>';
  function pintarXP() {
    let a = 0;
    E.lista.forEach(x => { a += E.xp[claveXP('p', x.id)] || 0; });
    E.listaC.forEach(x => { a += E.xp[claveXP('c', x.id)] || 0; });
    const b = E.lista.length * XP_PRED + E.listaC.length * XP_CONS, p = b ? a / b : 0;
    const r = p >= 1 ? 4 : p >= 0.67 ? 3 : p >= 0.34 ? 2 : p > 0 ? 1 : 0;
    const bar = $('#xp-barra');
    bar.style.setProperty('--p', Math.round(p * 100) + '%');
    bar.setAttribute('aria-valuenow', a); bar.setAttribute('aria-valuemax', b);
    bar.setAttribute('aria-valuetext', t('xp.txt', { a, b }) + ' · ' + t('rango.' + r));
    $('#xp-txt').textContent = t('xp.txt', { a, b }); $('#xp-rango').textContent = t('rango.' + r);
  }

  // ── AYUDITAS: una reserva por nivel (las reglas puras estan en AY, arriba) ──
  const CLAVE_AY = 'hpk-pseudocoder-ay', CLAVE_PREG = 'hpk-pseudocoder-preguntas';
  let ayTodo = {}, pregTodo = {};
  try { ayTodo = JSON.parse(localStorage.getItem(CLAVE_AY) || '{}'); pregTodo = JSON.parse(localStorage.getItem(CLAVE_PREG) || '{}'); } catch (_) {}
  const guardarAy = () => { try { localStorage.setItem(CLAVE_AY, JSON.stringify(ayTodo)); localStorage.setItem(CLAVE_PREG, JSON.stringify(pregTodo)); } catch (_) {} };
  function ayAct() {
    if (!ayTodo[REG]) ayTodo[REG] = AY.nuevo(Date.now());
    return AY.recargarTiempo(ayTodo[REG], Date.now());
  }
  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function gastarAyudita() {
    const e = ayAct();
    if (e.n < 1) return false;
    AY.gastar(e, Date.now()); guardarAy(); pintarAy();
    return true;
  }
  function ayGanarXP(g) { AY.ganarXP(ayAct(), g, Date.now()); guardarAy(); pintarAy(); }
  function pintarAy() {
    const e = ayAct(), bar = $('#ay-casillas'), sin = e.n < 1;
    bar.innerHTML = Array.from({ length: AY.MAX }, (_, k) => '<i class="' + (k < e.n ? 'on' : '') + '"></i>').join('');
    bar.setAttribute('aria-valuenow', e.n); bar.setAttribute('aria-valuemax', AY.MAX);
    bar.setAttribute('aria-valuetext', t('ay.txt', { n: e.n, max: AY.MAX }));
    const p = AY.proxima(e, Date.now());
    $('#ay-txt').textContent = t('ay.txt', { n: e.n, max: AY.MAX }) + ' · ' + (e.n >= AY.MAX ? t('ay.llena') : t('ay.proxima', { xp: p.xp, t: mmss(p.ms) }));
    $('#b-recarga').hidden = e.n >= AY.MAX;
    $('#b-recarga').disabled = !elegirPregunta('variables', pregTodo[REG] || []);
    document.querySelectorAll('[data-ayuda]').forEach(b => { b.disabled = sin; });     // los botones de ayudita se apagan sin reserva
  }
  setInterval(pintarAy, 1000);                       // cuenta atras y recarga por tiempo

  // ── la pregunta de recarga: ventana modal, asi que no se pueden consultar las ayudas mientras esta abierta ──
  function abrirQuiz() {
    const q = elegirPregunta((esReto() ? ret() : ej()).tema, pregTodo[REG] || []);
    if (!q) return;
    $('#quiz').dataset.q = q.id;
    $('#quiz-p').textContent = t('q.' + q.id + '.p');
    $('#quiz-cod').hidden = !q.codigo;
    if (q.codigo) $('#quiz-cod').innerHTML = q.codigo.split('\n').map((l, k) => '<div class="ln"><i>' + (k + 1) + '</i><span>' + resaltar(l) + '</span></div>').join('');
    // el orden de las opciones cambia cada vez: la correcta no esta siempre en el mismo sitio
    const ops = [['ok', true], ['x1', false], ['x2', false]].sort(() => Math.random() - 0.5);
    $('#quiz-op').innerHTML = ops.map(([c, ok]) => '<button type="button" class="btn quiz-op" data-ok="' + ok + '">' + esc(t('q.' + q.id + '.' + c)) + '</button>').join('');
    $('#quiz-res').className = 'fb'; $('#quiz-res').innerHTML = '';
    $('#quiz-cerrar').hidden = false; $('#quiz-sig').hidden = true;
    $('#quiz').showModal();
  }
  $('#b-recarga').onclick = abrirQuiz;
  $('#quiz-op').addEventListener('click', ev => {

  // ── resaltado del codigo ────────────────────────────────
  // Cada palabra se pinta segun lo que ES: palabra del lenguaje, caja (variable) o valor (numero / texto).
  const PALABRAS = new Set(['mientras', 'hacer', 'si', 'entonces', 'sino', 'fin', 'para', 'desde', 'hasta', 'mostrar', 'constante', 'leer', 'segun', 'según', 'caso', 'repetir']);
  const TOK = /("[^"]*")|([A-Za-zÁÉÍÓÚáéíóúÑñÜü_][A-Za-zÁÉÍÓÚáéíóúÑñÜü_0-9]*)|(\d+(?:\.\d+)?)|(←|<-|:=)|(\s+)|([\s\S])/g;
  function resaltar(linea) {
    const ci = linea.search(/#|\/\//);
    const cod = ci >= 0 ? linea.slice(0, ci) : linea, com = ci >= 0 ? linea.slice(ci) : '';
    const toks = []; let m; TOK.lastIndex = 0;
    while ((m = TOK.exec(cod))) toks.push(m[1] ? { t: 's', v: m[1] } : m[2] ? { t: 'w', v: m[2] } : m[3] ? { t: 'n', v: m[3] } : m[4] ? { t: 'as', v: m[4] } : m[5] ? { t: 'sp', v: m[5] } : { t: 'o', v: m[6] });
    const vecino = (k, d) => { for (let j = k + d; j >= 0 && j < toks.length; j += d) if (toks[j].t !== 'sp') return toks[j]; return null; };
    const esValor = x => x && (x.t === 's' || x.t === 'n' || (x.t === 'w' && !PALABRAS.has(x.v.toLowerCase())));
    const abre = x => esValor(x) || (x && x.t === 'o' && (x.v === '(' || x.v === '-')) || (x && x.t === 'w' && x.v.toLowerCase() === 'no');
    const cierra = x => esValor(x) || (x && x.t === 'o' && x.v === ')');
    // y / o / no son operadores solo entre operandos (igual que en el motor); en otro sitio son nombres de caja
    const html = toks.map((x, k) => {
      switch (x.t) {
        case 's': return '<span class="s">' + esc(x.v) + '</span>';
        case 'n': return '<span class="n">' + esc(x.v) + '</span>';
        case 'as': return '<span class="as">' + esc(x.v) + '</span>';
        case 'w': {
          const l = x.v.toLowerCase();
          if (l === 'verdadero' || l === 'falso') return '<span class="n">' + esc(x.v) + '</span>';
          const logico = (l === 'y' || l === 'o') ? cierra(vecino(k, -1)) && abre(vecino(k, 1))
            : l === 'no' ? abre(vecino(k, 1)) && !cierra(vecino(k, -1)) : false;
          const sigue = vecino(k, 1), conversion = (l === 'numero' || l === 'número' || l === 'texto') && sigue && sigue.t === 'o' && sigue.v === '(';
          return PALABRAS.has(l) || logico || conversion ? '<span class="k">' + esc(x.v) + '</span>' : '<span class="v">' + esc(x.v) + '</span>';
        }
        default: return esc(x.v);
      }
    }).join('');
    return html + (com ? '<span class="c">' + esc(com) + '</span>' : '');
  }

  // ── CONSTRUIR ───────────────────────────────────────────
  // La sangria no se arrastra: sale sola de mientras/si/para … fin.
  // Una pila de lo abierto: «segun» abre sus casos (cada «caso» y el «sino» del segun abren su bloque), «fin» cierra el bloque y el segun.
  function indentaciones(textos) {
    const pila = [];
    return textos.map(tx => {
      const m = /^\s*([a-záéíóúñü]+)/i.exec(tx), k = m ? m[1].toLowerCase() : '';
      const enCaso = () => pila[pila.length - 1] === 'caso';
      if (k === 'fin') { if (enCaso()) pila.pop(); pila.pop(); return pila.length; }
      if (k === 'hasta') { pila.pop(); return pila.length; }                 // cierra el «repetir»
      if (k === 'sino') { if (enCaso()) { pila.pop(); const r = pila.length; pila.push('caso'); return r; } return Math.max(0, pila.length - 1); }
      if (k === 'caso') { if (enCaso()) pila.pop(); const r = pila.length; pila.push('caso'); return r; }
      const r = pila.length; if (k === 'mientras' || k === 'si' || k === 'para' || k === 'repetir' || k === 'segun' || k === 'según') pila.push(k); return r;
    });
  }
  function mezclar(uids, solUids) {
    const a = uids.slice();
    for (let n = 0; n < 30; n++) {
      for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
      if (a.filter(u => solUids.includes(u)).join() !== solUids.join()) break;   // que no salga ya resuelto
    }
    return a;
  }
  function iniciarC() {

    C.id = r.id; C.bloques = new Map(); C.malLinea = -1; C.ayudas = 0; C.fallos = 0; C.montaje = [];
    const sol = r.solucion.map((x, k) => ({ uid: r.id + ':s' + k, texto: x, req: true }));
    const dis = r.distractores.map((x, k) => ({ uid: r.id + ':d' + k, texto: x, req: false }));
    [...sol, ...dis].forEach(b => C.bloques.set(b.uid, b));
    C.banco = mezclar([...sol, ...dis].map(b => b.uid), sol.map(b => b.uid));
    C.banco.forEach((u, k) => { C.bloques.get(u).orden = k; });
    $('#fb-c').className = 'fb'; $('#fb-c').innerHTML = '';
  }
  function prepararC() { if (C.id !== ret().id) iniciarC(); pintarC(); }
  function htmlBloque(b, num, d, mal) {

  }
  function pintarC(foco) {

    $('#montaje').innerHTML = C.montaje.map((u, k) => htmlBloque(C.bloques.get(u), k + 1, sang[k], k === C.malLinea)).join('');
    $('#banco').innerHTML = C.banco.map(u => htmlBloque(C.bloques.get(u), 0, 0, false)).join('');
    if (foco) { const el = document.querySelector('.bloque[data-uid="' + foco + '"]'); if (el) el.focus(); }
  }
  function sacar(uid) {

  }
  function colocar(uid, idx) {
    sacar(uid);
    const i = idx === undefined ? C.montaje.length : Math.max(0, Math.min(idx, C.montaje.length));
    C.montaje.splice(i, 0, uid); C.malLinea = -1;
    anunciar('cons.an.puesta', { n: i + 1 }); mascota('pensando'); pintarC(uid);
  }
  function devolver(uid) {
    const k = C.montaje.indexOf(uid);
    sacar(uid); C.banco.push(uid); C.banco.sort((a, b) => C.bloques.get(a).orden - C.bloques.get(b).orden);
    C.malLinea = -1; anunciar('cons.an.quitada');
    pintarC(C.montaje[Math.min(k, C.montaje.length - 1)] || uid);
  }
  function mover(uid, delta) {
    const k = C.montaje.indexOf(uid), n = k + delta;
    if (k < 0 || n < 0 || n >= C.montaje.length) return;
    C.montaje.splice(k, 1); C.montaje.splice(n, 0, uid); C.malLinea = -1;
    anunciar('cons.an.movida', { n: n + 1 }); pintarC(uid);
  }
  const accionBloque = uid => { if (C.montaje.includes(uid)) devolver(uid); else colocar(uid); };

  // Arrastre con puntero (raton y tactil con el mismo codigo). Un toque sin mover = pulsar.
  let arr = null;
  function destino(x, y) {
    const bajo = document.elementFromPoint(x, y), zona = bajo && bajo.closest('#montaje, #banco');
    document.querySelectorAll('.sobre,.al-final,.antes').forEach(n => n.classList.remove('sobre', 'al-final', 'antes'));
    arr.zona = zona; arr.idx = undefined;
    if (!zona) return;
    zona.classList.add('sobre');
    if (zona.id === 'montaje') {
      const els = [...zona.querySelectorAll('.bloque')].filter(e => e.dataset.uid !== arr.uid);
      arr.idx = els.filter(e => { const r = e.getBoundingClientRect(); return r.top + r.height / 2 < y; }).length;
      if (arr.idx < els.length) els[arr.idx].classList.add('antes'); else zona.classList.add('al-final');
    }
  }
  function terminarArrastre() {
    if (!arr) return;
    if (arr.ghost) arr.ghost.remove();
    arr.el.classList.remove('arrastrando');
    document.querySelectorAll('.sobre,.al-final,.antes').forEach(n => n.classList.remove('sobre', 'al-final', 'antes'));
  }
  document.addEventListener('pointerdown', ev => {
    if (E.modo !== 'construir' || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    const b = ev.target.closest('.bloque[data-uid]'); if (!b) return;
    const r = b.getBoundingClientRect();
    arr = { uid: b.dataset.uid, el: b, x: ev.clientX, y: ev.clientY, dx: ev.clientX - r.left, dy: ev.clientY - r.top, w: r.width, mov: false, ghost: null, id: ev.pointerId, zona: null, idx: undefined };
  });
  document.addEventListener('pointermove', ev => {
    if (!arr || ev.pointerId !== arr.id) return;
    if (!arr.mov) {
      if (Math.hypot(ev.clientX - arr.x, ev.clientY - arr.y) < 6) return;
      arr.mov = true;
      arr.ghost = arr.el.cloneNode(true); arr.ghost.classList.add('fantasma'); arr.ghost.removeAttribute('data-uid'); arr.ghost.style.width = arr.w + 'px';
      document.body.appendChild(arr.ghost); arr.el.classList.add('arrastrando');
    }
    arr.ghost.style.left = (ev.clientX - arr.dx) + 'px'; arr.ghost.style.top = (ev.clientY - arr.dy) + 'px';
    destino(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointerup', ev => {
    if (!arr || ev.pointerId !== arr.id) return;
    const a = arr; terminarArrastre(); arr = null;
    if (!a.mov) { accionBloque(a.uid); return; }
    if (a.zona && a.zona.id === 'montaje') colocar(a.uid, a.idx);
    else if (a.zona && a.zona.id === 'banco' && C.montaje.includes(a.uid)) devolver(a.uid);
  });
  document.addEventListener('pointercancel', () => { terminarArrastre(); arr = null; });
  // Teclado: un «click» con detail 0 es Intro/Espacio (el raton y el tactil ya se gestionan arriba).
  document.addEventListener('click', ev => {
    if (E.modo !== 'construir' || ev.detail !== 0) return;
    const b = ev.target.closest && ev.target.closest('.bloque[data-uid]'); if (b) accionBloque(b.dataset.uid);
  });
  addEventListener('keydown', ev => {
    if (E.modo !== 'construir') return;
    const b = ev.target.closest && ev.target.closest('.bloque[data-uid]'); if (!b) return;
    const uid = b.dataset.uid;
    if (!C.montaje.includes(uid)) return;
    if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); mover(uid, ev.key === 'ArrowUp' ? -1 : 1); }
    else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); devolver(uid); }
  });

  $('#chk-lectura').onchange = ev => { E.lectura = ev.target.checked; pintarC(); };
  $('#c-vaciar').onclick = () => { const f = C.fallos, a = C.ayudas; C.id = null; iniciarC(); C.fallos = f; C.ayudas = a; pintarC(); mascota('idle'); };
  $('#c-ayuda').onclick = () => {
    const sol = ret().solucion; let k = 0;
    while (k < C.montaje.length && k < sol.length && C.bloques.get(C.montaje[k]).texto === sol[k]) k++;
    const fb = $('#fb-c');
    if (k >= sol.length && C.montaje.length === sol.length) { fb.className = 'fb'; fb.textContent = t('cons.ayuda.nada'); return; }
    if (!gastarAyudita()) { fb.className = 'fb mal'; fb.textContent = t('ay.sin'); return; }
    C.montaje.splice(k).forEach(u => C.banco.push(u));
    C.banco.sort((a, b) => C.bloques.get(a).orden - C.bloques.get(b).orden);
    const u = C.banco.find(x => C.bloques.get(x).req && C.bloques.get(x).texto === sol[k]);
    sacar(u); C.montaje.push(u); C.ayudas++; C.malLinea = -1;
    fb.className = 'fb'; fb.textContent = t('cons.ayuda.puesta');
    pintarC(u);
  };
  // pista propia del reto (p. ej. en el intercambio, «a y b acaban valiendo lo mismo»): se decide con el estado final de las cajas
  // y con las líneas montadas. La usan Construir (al comprobar) y Mirar (al ver el programa montado).
  function pistaDe(r, lineas) {
    if (!r.pistas) return null;
    const pr = MOTOR.correr(lineas.join('\n'), null, r.entrada), fin = {};
    (pr.pasos.length ? pr.pasos[pr.pasos.length - 1].vars : []).forEach(v => { fin[v.n] = v.v; });
    return r.pistas.find(p => p.si(fin, lineas)) || null;
  }
  $('#c-comprobar').onclick = () => {
    const r = ret(), lineas = C.montaje.map(u => C.bloques.get(u).texto), fb = $('#fb-c');
    const res = MOTOR.comprobarConstruccion(r.solucion, lineas, r.entradas, { entrada: r.entrada, alternativas: r.alternativas });
    E.ultimo = { id: r.id, estado: res.estado, mio: res.mio, correcta: res.estado === 'ok' };
    const botones = res.pasos > 0 && res.estado !== 'ok' ? '<button class="btn" id="c-ver">' + esc(t('cons.ver')) + '</button>' : '';
    const ver = () => { const b = $('#c-ver'); if (b) b.onclick = () => { E.codigoMirar = lineas.join('\n'); E.modo = 'mirar'; E.paso = -1; E.modelo = ''; vista(); }; };
    C.malLinea = res.estado === 'error' && res.error.linea ? res.error.linea - 1 : -1;
    if (res.estado === 'ok') {
      const gan = otorgar('c', r.id, XP_CONS, C.fallos, C.ayudas); mascota('feliz');
      const hay = E.c < E.listaC.length - 1;
      fb.className = 'fb ok';
      fb.innerHTML = '<strong>' + esc(t('cons.fb.ok')) + '</strong>' + (res.igualPlan ? '' : esc(t('cons.fb.otro')) + ' ') + esc(tcon('trampa')) + xpHtml(gan) +
        '<div class="acciones">' + (hay ? '<button class="btn primario" id="c-sig">' + esc(t('cons.sig')) + '</button>' : '') +
        '<button class="btn" id="c-ver2">' + esc(t('cons.ver')) + '</button></div>';
      const s = $('#c-sig'); if (s) s.onclick = () => cargarC(E.c + 1);
      $('#c-ver2').onclick = () => { E.codigoMirar = lineas.join('\n'); E.modo = 'mirar'; E.paso = -1; E.modelo = ''; vista(); };
      pintarLista(); pintarC();
      return;
    }
    let msg;
    switch (res.estado) {
      case 'vacio': msg = t('cons.fb.vacio'); break;
      case 'faltan':
        msg = t('cons.fb.faltan', { n: res.n });
        if (res.error) msg += ' ' + t('cons.fb.faltanerror', { n: res.error.linea, msg: t('err.' + res.error.id, res.error.p) });
        else if (res.mio && res.mio.length) msg += ' ' + t('cons.fb.faltansale', { mio: res.mio.join(' ') });
        break;
      case 'error': msg = t('cons.fb.error', { n: res.error.linea, msg: t('err.' + res.error.id, res.error.p) }); break;
      case 'colgado': msg = t('cons.fb.colgado'); break;
      case 'distinta':
        msg = t('cons.fb.distinta', { mio: res.mio.join(' ') || t('cons.nada'), esperado: res.esperado.join(' ') || t('cons.nada') });
        if (C.montaje.some(u => !C.bloques.get(u).req)) msg += ' ' + t('cons.fb.sobra');
        break;
      case 'coincide':
        msg = t('cons.fb.coincide', { datos: res.datos, mio: res.mio.join(' ') || t('cons.nada'), esperado: res.esperado.join(' ') || t('cons.nada') });
        break;
      case 'estado':
        msg = t(res.datos ? 'cons.fb.estado' : 'cons.fb.estado0', { datos: res.datos, nombre: res.nombre, mio: res.mio === undefined ? t('cons.vacia') : res.mio, esperado: res.esperado });
        break;
      default: msg = t('cons.fb.casi');
    }
    const pista = res.estado !== 'vacio' ? pistaDe(r, lineas) : null;
    mascota('fallo'); C.fallos++;
    fb.className = 'fb mal';
    fb.innerHTML = esc(msg) + (pista ? '<p class="pista">' + esc(t('cons.' + r.id + '.pista.' + pista.id)) + '</p>' : '') + (botones ? '<div class="acciones">' + botones + '</div>' : '');
    ver(); pintarC();
  };

  // ── MIRAR ───────────────────────────────────────────────
  function prepararMirar() {
    const sel = $('#sel-modelo');
    sel.innerHTML = '<option value="">' + esc(t('mirar.real')) + '</option>' +
      MOTOR.MODELOS.map(m => '<option value="' + m.id + '">' + esc(t('mirar.modelo', { creencia: t('mod.' + m.id + '.corto') })) + '</option>').join('');
    sel.value = E.modelo;
    recalcular();
  }
  function recalcular() {
    const m = MOTOR.MODELOS.find(x => x.id === E.modelo);
    E.traza = MOTOR.correr(codigoActual(), m ? m.flags : {}, entradaActual());
    const av = $('#aviso-modelo');
    av.hidden = !m;
    if (m) {
      av.innerHTML = '<strong>' + esc(t('mirar.aviso')) + '</strong> ' + esc(t('mod.' + m.id + '.diag')) +
        '<div class="acciones"><button type="button" class="btn" id="b-real">' + esc(t('mirar.volver')) + '</button></div>';
      $('#b-real').onclick = () => { pararAuto(); E.modelo = ''; E.paso = -1; $('#sel-modelo').value = ''; recalcular(); };
    }
    // la pista de Construir se repite aquí cuando se llega desde «Ver mi programa paso a paso»
    const pm = $('#pista-mirar'), pista = E.codigoMirar !== null && !m ? pistaDe(ret(), E.codigoMirar.split('\n')) : null;
    pm.hidden = !pista;
    pm.innerHTML = pista ? '<strong>' + esc(t('mirar.pista')) + '</strong> ' + esc(t('cons.' + ret().id + '.pista.' + pista.id)) : '';
    pintarMirar();
  }
  const textoNota = n => t('nota.' + n.id, n.p);
  function pintarMirar() {
    const tr = E.traza, p = E.paso >= 0 ? tr.pasos[E.paso] : null, e = $('#err-codigo');
    pintarCodigo(p ? p.linea : 0);
    const conTipo = ['tipos', 'entrada'].includes((esReto() ? ret() : ej()).tema);           // en el tema de tipos cada caja dice de qué tipo es
    $('#cajas').innerHTML = p ? p.vars.map(v => '<div class="caja' + (v.n === p.cambia ? ' cambia' : '') + (v.c ? ' const' : '') + '"><b>' + esc(v.n) + '</b><span>' + esc(v.v) + '</span>' + (v.f ? '<em>ƒ ' + esc(v.f) + '</em>' : '') + (v.c ? '<em>' + esc(t('mirar.const')) + '</em>' : '') + (conTipo && v.t ? '<em class="tipo">' + esc(t('tipo.' + v.t)) + '</em>' : '') + '</div>').join('') : '';
    $('#pantalla').textContent = p ? p.salida.join('\n') : '';
    const fin = E.paso >= tr.pasos.length - 1;
    let nota = p ? textoNota(p.nota) : t('mirar.inicio');
    if (p && fin) nota += tr.colgado ? '  ' + t('fin.colgado') : tr.error ? '' : '  ·  ' + t('fin.ok');
    $('#nota').textContent = nota;
    if (tr.error && (fin || !tr.pasos.length)) {
      e.hidden = false; e.className = 'hint err';
      e.textContent = t('err.linea', { n: tr.error.linea, msg: t('err.' + tr.error.id, tr.error.p) });
    } else e.hidden = true;
    $('#b-ant').disabled = E.paso < 0; $('#b-sig').disabled = fin;
  }
  const sig = () => { if (E.paso < E.traza.pasos.length - 1) { E.paso++; pintarMirar(); } else pararAuto(); };
  $('#b-sig').onclick = () => { pararAuto(); sig(); };
  $('#b-ant').onclick = () => { pararAuto(); if (E.paso >= 0) { E.paso--; pintarMirar(); } };
  $('#b-reset').onclick = () => { pararAuto(); E.paso = -1; pintarMirar(); };
  $('#sel-modelo').onchange = ev => { pararAuto(); E.modelo = ev.target.value; E.paso = -1; recalcular(); };
  function pararAuto() { if (E.timer) { clearInterval(E.timer); E.timer = null; } $('#b-auto').textContent = t('b.auto'); }
  $('#b-auto').onclick = () => {
    if (E.timer) { pararAuto(); return; }
    if (E.paso >= E.traza.pasos.length - 1) { E.paso = -1; pintarMirar(); }
    $('#b-auto').textContent = t('b.pausa');
    E.timer = setInterval(sig, 900);
  };
  addEventListener('keydown', ev => {
    if (E.modo !== 'mirar' || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowRight') { pararAuto(); sig(); }
    if (ev.key === 'ArrowLeft') { pararAuto(); if (E.paso >= 0) { E.paso--; pintarMirar(); } }
  });

  // ── RECORRIDO POR PANTALLAS (solo en pantalla estrecha): Elegir → Reto ──
  // En pantalla ancha todo sigue a la vista; aqui solo se decide cual de las dos se muestra (html[data-pantalla]).
  // El historial del navegador sigue el recorrido, asi que «atras» en el movil vuelve a Elegir en vez de salir.
  const ESTRECHO = matchMedia('(max-width:700px)');
  let pantalla = 'elegir', ayClave = '';
  const arriba = () => { if (ESTRECHO.matches) window.scrollTo(0, 0); };
  function aplicarPantalla(p, foco) {
    pantalla = p; document.documentElement.dataset.pantalla = p;
    if (!ESTRECHO.matches) return;
    window.scrollTo(0, 0);
    if (foco) { const el = p === 'reto' ? $('#ej-titulo') : $('h1'); el.tabIndex = -1; el.focus({ preventScroll: true }); }
  }
  function irAReto() {
    if (!ESTRECHO.matches || pantalla === 'reto') return;
    try { history.pushState({ p: 'reto' }, ''); } catch (_) {}
    aplicarPantalla('reto', true);
  }
  function arrancarPantalla(directo) {
    try { history.replaceState({ p: 'elegir' }, ''); } catch (_) {}
    aplicarPantalla('elegir', false);
    if (directo) irAReto();                       // un enlace directo (?ej=, ?modo=) entra directo al reto
  }
  $('#b-elegir').onclick = () => { if (history.state && history.state.p === 'reto') history.back(); else aplicarPantalla('elegir', true); };
  addEventListener('popstate', ev => aplicarPantalla(ev.state && ev.state.p === 'reto' ? 'reto' : 'elegir', true));

  // cambiar de modo sin volver a Elegir
  const cierraMenu = () => { $('#tira-menu').hidden = true; $('#b-modo').setAttribute('aria-expanded', 'false'); };
  $('#b-modo').onclick = () => { const abrir = $('#tira-menu').hidden; $('#tira-menu').hidden = !abrir; $('#b-modo').setAttribute('aria-expanded', String(abrir)); };
  $('#tira-menu').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; cierraMenu(); $('#m-' + b.dataset.m).click(); $('#b-modo').focus(); });
  document.addEventListener('click', e => { if (!e.target.closest('.tira-modo')) cierraMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#tira-menu').hidden) { cierraMenu(); $('#b-modo').focus(); } });

  // ayudas plegadas: en el primer reto de cada tema avisa de que hay algo que leer
  function pintarAyBtn() {
    const reto = esReto(), lista = reto ? E.listaC : E.lista, i = reto ? E.c : E.i;
    const ab = $('#ayudas').classList.contains('abierto'), primero = esPrimeroDelTema(lista, i);
    $('#b-ayudas').setAttribute('aria-expanded', String(ab));
    $('#b-ayudas').innerHTML = '<span>' + esc(t('ayudas.titulo')) + (primero && !ab ? ' <span class="ayudas-dot">● ' + esc(t('ayudas.primero')) + '</span>' : '') +
      '</span><span aria-hidden="true">' + (ab ? '▴' : '▾') + '</span>';
  }
  $('#b-ayudas').onclick = () => { $('#ayudas').classList.toggle('abierto'); pintarAyBtn(); };
  function pintarTira() {
    const reto = esReto(), lista = reto ? E.listaC : E.lista, i = reto ? E.c : E.i;
    $('#tira-n').textContent = t('tira.reto', { n: i + 1, m: lista.length });
    $('#b-modo').textContent = (E.modo === 'mirar' ? t('tira.mirar') : t('modo.' + E.modo)) + ' ▾'; $('#b-modo').setAttribute('aria-label', t('tira.modo', { m: t('modo.' + E.modo) }));
    document.querySelectorAll('#tira-menu [data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === E.modo)));
    const k = E.modo + ':' + i + ':' + (E.codigoMirar !== null);
    if (k !== ayClave) { ayClave = k; $('#ayudas').classList.remove('abierto'); }
    pintarAyBtn(); pintarPlegar(compacto);
  }

  // subtitulo plegable (preferencia compartida con el resto del laboratorio)
  function pintarPlegar(c) {
    document.documentElement.dataset.compacto = c ? 'si' : 'no';
    const b = $('#b-plegar');
    b.setAttribute('aria-expanded', String(!c)); b.setAttribute('aria-label', t(c ? 'plegar.abre' : 'plegar.cierra')); b.textContent = c ? '▼' : '▲';
  }
  let compacto = false; try { compacto = localStorage.getItem('hpk-compacto') === 'si'; } catch (_) {}
  $('#b-plegar').onclick = () => { compacto = !compacto; try { localStorage.setItem('hpk-compacto', compacto ? 'si' : 'no'); } catch (_) {} pintarPlegar(compacto); };


  // skin (CRT / lab) y fosforo: solo estetica. El boton de encendido del monitor alterna el skin.
  const guardarPref = (k, v) => { try { localStorage.setItem('hpk-pseudocoder-' + k, v); } catch (_) {} };
  function pintarSkin() {
    const r = document.documentElement;
    $('#b-skin').setAttribute('aria-pressed', String(r.dataset.skin === 'crt'));
    document.querySelectorAll('.knob').forEach(k => k.setAttribute('aria-pressed', String(k.dataset.f === r.dataset.fosforo)));
  }
  $('#b-skin').onclick = () => { const r = document.documentElement; r.dataset.skin = r.dataset.skin === 'crt' ? 'lab' : 'crt'; guardarPref('skin', r.dataset.skin); pintarSkin(); };
  document.querySelectorAll('.knob').forEach(k => { k.onclick = () => { document.documentElement.dataset.fosforo = k.dataset.f; guardarPref('fosforo', k.dataset.f); pintarSkin(); }; });
  pintarSkin();

  // arranque:  ?nivel=primaria|eso|bach   ?modo=predecir|mirar|construir   ?ej=N
  const q = new URLSearchParams(location.search);
  let r0 = q.get('nivel'); try { if (!r0) r0 = localStorage.getItem(CLAVE_NIVEL); } catch (_) {}
  if (!r0 || !Object.hasOwn(REGISTROS, r0)) r0 = BASE;
  fijarNivel(r0);
  const m0 = ['predecir', 'mirar'].includes(q.get('modo')) ? q.get('modo') : 'construir';
  const n0 = parseInt(q.get('ej') || '1', 10) - 1;
  E.modo = m0;
  if (m0 === 'construir') E.c = n0 >= 0 && n0 < E.listaC.length ? n0 : 0;
  else E.i = n0 >= 0 && n0 < E.lista.length ? n0 : 0;
  vista();
  arrancarPantalla(q.has('ej') || q.has('modo'));
  $('#glosario').open = E.modo === 'construir' ? esPrimeroDelTema(E.listaC, E.c) : esPrimeroDelTema(E.lista, E.i);
  // KORU (capa silenciosa): la instantanea del reto abierto; KORU.estado() la convierte en estado de la herramienta.
  function instantanea() {
    const reto = esReto(), r = reto ? ret() : ej();
    if (!r) return null;
    const u = E.ultimo && E.ultimo.id === r.id ? E.ultimo : null;
    return { nivel: REG, modo: E.modo, tipo: reto ? 'construir' : 'predecir', id: r.id, tema: r.tema,
      titulo: reto ? tcon('titulo') : tej('titulo'),
      codigo: reto ? E.codigoMirar : codigoActual(),
      solucion: reto ? r.solucion.join('\n') : null,
      entrada: r.entrada || null,
      montaje: reto && E.modo === 'construir' && C.id === r.id ? C.montaje.map(x => C.bloques.get(x).texto) : null,
      fallos: reto ? C.fallos : E.fallosP, ayudas: reto ? C.ayudas : (E.ayudaP ? 1 : 0),
      xp: E.xp[claveXP(reto ? 'c' : 'p', r.id)] || 0, modelo: E.modelo, ultimo: u };
  }
  window.exportState = () => KORU.estado(instantanea());
  window.__E = E; window.__C = C;
})();
</script>
<script src="../lab.js"></script>
</body>
