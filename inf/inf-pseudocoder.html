  Modulo de fundamentos de programacion, agnostico del lenguaje.
  Idea central: no solo decir "mal", sino POR QUE. El motor ejecuta el programa
  tambien con malentendidos tipicos (MODELOS) y mira cual reproduce la respuesta
  de quien lo intenta.

  ── DONDE VIVE CADA COSA ────────────────────────────────────────────────
  · MOTOR      Logica. No contiene ninguna frase: devuelve ids (+ parametros).
  · TEXTOS     TODAS las frases de la interfaz, por idioma y registro.
  · REGISTROS  Que ejercicios entran en cada curso.
  · EJERCICIOS Solo el codigo y el tema; titulo/consigna/trampa estan en TEXTOS.
  · APP        Pinta. Pide cada frase con t('clave', {huecos}).

  ADAPTAR A UN CURSO: escribe en TEXTOS.es.<registro> SOLO las claves que cambian;
  las que falten caen al registro base (eso). ?nivel=primaria|eso|bach
-->

<style>
:root {

:root[data-theme="light"] {

  --text:#3d3345; --muted:#695e6c; --border:rgba(58,33,52,.14);
  --green:#117143; --blue:#275fb7; --amber:#90540e; --red:#ad3b41; --purple:#7656b8;
  --focus:#0d6b84;
  --kw:#6b3fb0; --num:#8a4d00; --str:#136b3b; --com:#695e6c; --var:#0a5a8f; --asig:#9e1b5f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem 16px 5rem}
.topbar{font:.72rem 'DM Mono',monospace;letter-spacing:.06em;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.3rem 0 1rem}
.topbar a{color:var(--muted);text-decoration:none;display:inline-block;padding:.35rem 0}.topbar a:hover{color:var(--text)}
.salto{position:absolute;left:.5rem;top:-4rem;z-index:80;background:var(--surface);color:var(--text);border:2px solid var(--focus);border-radius:6px;padding:.5rem .8rem;font:600 .85rem 'Nunito',sans-serif;text-decoration:none}
.salto:focus{top:.5rem}
.pie{font:.67rem 'DM Mono',monospace;letter-spacing:.04em;color:var(--muted);text-align:center;margin:1.6rem 0 0}
.pie a{color:var(--text);text-decoration:underline;text-underline-offset:.2em;display:inline-block;padding:.45rem .3rem}.pie a:hover{text-decoration-thickness:2px}
h1{font:700 clamp(1.7rem,4.5vw,2.5rem)/1.1 'Space Grotesk',sans-serif;margin:.2rem 0 .3rem}
.sub{color:var(--muted);margin:0 0 1.2rem}
.barra{display:flex;gap:.5rem 1.2rem;margin-bottom:.9rem;flex-wrap:wrap;align-items:center}
.modos{display:flex;gap:.5rem;flex-wrap:wrap}
.nivel{display:flex;gap:.4rem;align-items:center;font:.8rem 'DM Mono',monospace;color:var(--muted)}
.modo,.chip,.btn{font:600 .85rem 'Nunito',sans-serif;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.45rem 1rem;cursor:pointer}
.modo[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.bloques{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 .8rem}
.sinsel{display:none;margin:.8rem 0}
@media(min-width:701px){:root[data-sinsel="1"] .grid{display:none}:root[data-sinsel="1"] .sinsel{display:block}}
.bloques:empty{display:none}
.tab{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.tab .prog{margin-top:.1rem;font-weight:700;font-size:.85em;white-space:nowrap}
.btn.primario{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled),.chip:hover{border-color:var(--magenta)}
.temas{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.2rem}
.tema{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tema-n{font:.7rem 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:7.5rem}
.chip{padding:.3rem .8rem;font-size:.8rem}
.chip[aria-current="true"]{border-color:var(--magenta);background:var(--magenta-soft)}
.chip.ok::after{content:" ✓";color:var(--green)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem}
.panel h2{font:600 1.15rem 'Space Grotesk',sans-serif;margin:0 0 .2rem}
.consigna{color:var(--muted);margin:.1rem 0 .8rem}
.codigo{font:500 1rem/1.7 'DM Mono',monospace;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.6rem 0;overflow-x:auto;margin:0}
.ln{display:flex;white-space:pre;padding-right:1rem}
.ln i{font-style:normal;color:var(--muted);width:2.6rem;text-align:right;padding-right:.9rem;flex:none;user-select:none}
.ln.activa{background:var(--magenta-soft);box-shadow:inset 3px 0 0 var(--magenta)}
/* la linea activa lleva un tinte: en la piel laboratorio con tema claro hay que oscurecer un poco el numero y los colores del codigo para llegar a 4,5:1 */
:root[data-skin="lab"][data-theme="light"] .ln.activa{--var:#094a73;--muted:#4f4555;--str:#0e5a30;--num:#774100;--kw:#5b3299;--com:#4f4555}
.k{color:var(--kw);font-weight:600}.n{color:var(--num)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.as{color:var(--asig,var(--magenta));font-weight:700}
.mascota{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.cara{font:600 1.1rem 'DM Mono',monospace;background:var(--surface2);border:2px solid var(--border);border-radius:18px;padding:.5rem .8rem;min-width:7rem;text-align:center;transition:border-color .2s,background .2s}
.cara[data-estado="feliz"]{border-color:var(--green)}
.cara[data-estado="fallo"]{border-color:var(--red)}
.cara[data-estado="pensando"]{border-color:var(--purple)}
.cara[data-estado="dormido"]{opacity:.7}
.mascota small{color:var(--muted)}
label{font-weight:700;display:block;margin-bottom:.3rem}
.fila{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
input[type=text]{font:500 1.05rem 'DM Mono',monospace;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.55rem .8rem;flex:1;min-width:10rem}
.hint{color:var(--muted);font-size:.85rem;margin:.3rem 0 .8rem}
.fb .pista{margin:.7rem 0 0}
.fb{margin-top:.9rem;border-radius:12px;padding:.8rem 1rem;border:1px solid var(--border);background:var(--surface2)}
.fb:empty{display:none}
.fb.ok{border-color:var(--green)}.fb.mal{border-color:var(--red)}.fb.dx{border-color:var(--amber)}
.fb strong{display:block;margin-bottom:.2rem}
.fb .acciones,.aviso-modelo .acciones{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.cajas{display:flex;gap:.6rem;flex-wrap:wrap;min-height:5rem;margin:.5rem 0 1rem}
.caja{border:2px solid var(--border);border-radius:10px;background:var(--bg);padding:.3rem .8rem .5rem;text-align:center;min-width:4.2rem}
.caja b{display:block;font:600 .75rem 'DM Mono',monospace;color:var(--muted);letter-spacing:.04em}
.caja span{font:600 1.5rem 'DM Mono',monospace}
.caja.cambia{border-color:var(--magenta);background:var(--magenta-soft)}
.caja.const{border-style:double;border-width:4px}
.caja em.tipo{color:var(--muted)}
.entrada{margin:0 0 .8rem;padding:.4rem .8rem;border:1px dashed var(--amber);border-radius:8px;font:500 .95rem 'DM Mono',monospace;color:var(--text)}
.caja em{display:block;font:normal .65rem 'DM Mono',monospace;color:var(--amber)}
@media(prefers-reduced-motion:no-preference){.caja.cambia{animation:pop .35s ease}}
@keyframes pop{50%{transform:scale(1.07)}}
.pantalla{font:500 1rem/1.5 'DM Mono',monospace;background:#0b0a10;color:#7fe0a0;border-radius:10px;padding:.6rem .9rem;min-height:3.2rem;margin:.4rem 0 1rem;white-space:pre-wrap}
.sec{font:.7rem 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.nota{min-height:2.6rem;color:var(--text)}
.aviso-modelo{border:1px dashed var(--amber);border-radius:10px;padding:.6rem .8rem;margin-bottom:.8rem;background:color-mix(in srgb,var(--amber) 8%,transparent)}
select{font:600 .85rem 'Nunito',sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.4rem .6rem;max-width:100%}
.err{color:var(--red)}
/* ── CONSTRUIR (montar el programa con piezas) ── */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.montaje,.banco{display:flex;flex-direction:column;gap:.35rem;border-radius:10px;padding:.5rem}
.montaje{min-height:7rem;background:var(--bg);border:2px dashed var(--border);margin:.4rem 0}
.banco{min-height:4rem;background:var(--surface2);border:1px solid var(--border);margin:.4rem 0 .8rem}
.montaje:empty::before{content:attr(data-vacio);color:var(--muted);font-size:.9rem;padding:.6rem}
.montaje.sobre,.banco.sobre{border-color:var(--magenta)}
.bloque{display:flex;flex-wrap:wrap;align-items:baseline;width:100%;text-align:left;font:500 .95rem/1.45 'DM Mono',monospace;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--kw);border-radius:8px;padding:.35rem .7rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.bloque:hover{border-color:var(--magenta)}
.bloque .nl{width:1.8rem;flex:none;color:var(--muted);font-size:.8rem}
.bloque .cod{flex:1 1 5rem;min-width:0;padding-left:calc(var(--d,0) * 1.4rem);white-space:pre-wrap;overflow-wrap:anywhere}
.bloque .lee{flex-basis:100%;padding-left:calc(1.8rem + var(--d,0) * 1.4rem);font:italic .78rem 'Nunito',sans-serif;color:var(--muted)}
.banco .bloque .lee{padding-left:0}
.bloque.arrastrando{opacity:.35}
.bloque.mal{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.bloque.antes{box-shadow:0 -3px 0 var(--magenta)}
.montaje.al-final{box-shadow:inset 0 -3px 0 var(--magenta)}
.bloque.fantasma{position:fixed;z-index:100;pointer-events:none;opacity:.95;box-shadow:0 8px 22px var(--magenta-glow);width:auto;cursor:grabbing;margin:0}
.lectura{display:flex;gap:.5rem;align-items:center;font-weight:600;font-size:.85rem;margin:.2rem 0 .8rem}
.lectura input{width:1.6rem;height:1.6rem;flex:none}
/* CRT: sprite sin caja. En oscuro el contorno y el cable negros se pierden: halo claro fino. */
.cara{background:none;border:0;padding:0;min-width:0;line-height:0}
.cara img{display:block;height:120px;width:auto}
:root:not([data-theme="light"]) .cara img{filter:drop-shadow(0 0 1px rgba(255,255,255,.7)) drop-shadow(0 0 3px rgba(255,255,255,.25))}
/* ── HUD: nivel + XP (en los dos skins) ── */
.hud{display:flex;gap:.6rem 1.4rem;align-items:center;flex-wrap:wrap;padding:.6rem .9rem;margin:0 0 .9rem;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.hud-nivel{display:flex;gap:.5rem;align-items:center;font:.8rem 'DM Mono',monospace;color:var(--muted)}
.hud-nivel label{margin:0;font:inherit}
.hud-xp{display:flex;gap:.7rem;align-items:center;flex:1 1 16rem;min-width:0}
.xp-barra{flex:1 1 8rem;height:1rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.xp-barra i{display:block;height:100%;width:var(--p,0%);background:repeating-linear-gradient(90deg,var(--magenta) 0 9px,transparent 9px 12px)}
@media(prefers-reduced-motion:no-preference){.xp-barra i{transition:width .5s ease}}
#xp-txt{font:600 .85rem 'DM Mono',monospace;white-space:nowrap}
.xp-rango{font:700 .72rem 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.xp-gana{font-weight:800;color:var(--green);margin-top:.5rem}

/* ── Controles del monitor: encendido (skin) y fosforo ── */
.crt-base{display:flex;gap:.8rem 1.2rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:1rem}
.crt-marca{font:700 .7rem 'DM Mono',monospace;letter-spacing:.2em;color:var(--muted)}
.crt-mandos{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.crt-power{display:inline-flex;gap:.5rem;align-items:center;font:600 .75rem 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.crt-power .led{width:.6rem;height:.6rem;border-radius:50%;background:#4a4a4a}
.crt-power[aria-pressed="true"] .led{background:#6dff7a;box-shadow:0 0 6px #6dff7a}
.crt-fosforo{display:flex;gap:.5rem;align-items:center}
.knob{width:1.75rem;height:1.75rem;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;background:var(--c)}
.knob[data-f="verde"]{--c:#5dff95}.knob[data-f="ambar"]{--c:#ffb833}.knob[data-f="cian"]{--c:#5ceaff}
.knob[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:2px}
:root[data-skin="lab"] .crt-fosforo{display:none}

/* ═════════ SKIN CRT ═════════
   Todo el juego dentro de un monitor de fosforo. Solo estetica: el skin «lab» (por defecto
   antes) sigue intacto. El fosforo se elige con data-fosforo en <html>. */
:root[data-skin="crt"]{--f:#5dff95;--fbg:#040c07;--fbg2:#08170e;--fglow:rgba(93,255,149,.5)}
:root[data-skin="crt"][data-fosforo="ambar"]{--f:#ffb833;--fbg:#0e0902;--fbg2:#191003;--fglow:rgba(255,184,51,.5)}
:root[data-skin="crt"][data-fosforo="cian"]{--f:#5ceaff;--fbg:#030a0e;--fbg2:#071720;--fglow:rgba(92,234,255,.5)}

/* carcasa: plastico crema */
:root[data-skin="crt"] .crt-bisel{background:linear-gradient(150deg,#dcd3c3,#bdb29f 55%,#a89e8b);border-radius:30px;padding:22px 22px 12px;box-shadow:0 22px 44px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.22)}
:root[data-skin="crt"] .crt-marca{color:#3a3326}
:root[data-skin="crt"] .crt-power{background:linear-gradient(#e6dccb,#c9bfac);color:#2c2720;border:2px solid;border-color:#fff7e6 #7d7464 #7d7464 #fff7e6;border-radius:4px}
:root[data-skin="crt"] .crt-power:active{border-color:#7d7464 #fff7e6 #fff7e6 #7d7464;transform:translate(1px,1px)}
:root[data-skin="crt"] .knob{border:2px solid #4b453a;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 1px 0 #fff7e6}

/* pantalla: cristal combado con scanlines y viñeta */
:root[data-skin="crt"] .crt-pantalla{
  --bg:var(--fbg);--surface:var(--fbg2);--surface2:color-mix(in srgb,var(--f) 9%,var(--fbg));
  --text:var(--f);--muted:color-mix(in srgb,var(--f) 82%,var(--fbg));--border:color-mix(in srgb,var(--f) 32%,transparent);
  --magenta:var(--f);--magenta-soft:color-mix(in srgb,var(--f) 15%,transparent);--magenta-glow:var(--fglow);
  --red:#ff8579;--amber:#ffc65c;--green:#9dffb8;--purple:#c5a8ff;--focus:#ffffff;
  --var:color-mix(in srgb,var(--f) 18%,#fff);--kw:color-mix(in srgb,var(--f) 60%,#fff);--num:color-mix(in srgb,var(--f) 40%,#ffd9a0);--str:color-mix(in srgb,var(--f) 55%,#d6ffe6);--com:var(--muted);--asig:var(--f);
  position:relative;overflow:hidden;border-radius:38px/32px;color:var(--text);
  background:radial-gradient(ellipse at 50% 38%,var(--fbg2) 0%,var(--fbg) 85%);
  box-shadow:inset 0 0 0 4px #000,inset 0 0 90px rgba(0,0,0,.8),0 0 0 6px #6f6657,0 0 0 8px #3b362d;
  font-family:'VT323','DM Mono',monospace;font-size:1.22rem;line-height:1.3;text-shadow:0 0 5px var(--fglow)}
:root[data-skin="crt"] .crt-pantalla::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%)}
:root[data-skin="crt"] .crt-contenido{position:relative;z-index:1;padding:1.6rem 1.8rem 1.4rem}
@media(max-width:600px){:root[data-skin="crt"] .crt-bisel{padding:10px 10px 8px;border-radius:20px}
  :root[data-skin="crt"] .crt-pantalla{border-radius:24px/20px}:root[data-skin="crt"] .crt-contenido{padding:1rem .9rem}}

/* tipografia de terminal */
:root[data-skin="crt"] h1{font:400 clamp(2rem,6vw,3.2rem)/1.05 'VT323',monospace;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 10px var(--fglow)}
:root[data-skin="crt"] h1::after{content:"█";content:"█" / "";margin-left:.3rem;opacity:.9}
@media(prefers-reduced-motion:no-preference){:root[data-skin="crt"] h1::after{animation:cursor 1.1s steps(1) infinite}}
@keyframes cursor{50%{opacity:0}}
:root[data-skin="crt"] .panel h2{font:400 1.6rem/1.1 'VT323',monospace;text-transform:uppercase;letter-spacing:.03em}
:root[data-skin="crt"] .sub,:root[data-skin="crt"] .consigna,:root[data-skin="crt"] .hint,:root[data-skin="crt"] .leyenda,:root[data-skin="crt"] .glosario{font-size:1.1rem}
:root[data-skin="crt"] label{font-weight:400}
:root[data-skin="crt"] .hud,:root[data-skin="crt"] .panel{border-radius:6px;background:color-mix(in srgb,var(--f) 5%,var(--fbg))}
:root[data-skin="crt"] .panel{border:1px solid var(--border)}
:root[data-skin="crt"] .hud-nivel,:root[data-skin="crt"] #xp-txt,:root[data-skin="crt"] .xp-rango,:root[data-skin="crt"] .tema-n,:root[data-skin="crt"] .sec{font-family:'VT323',monospace;font-size:1.05rem;letter-spacing:.06em}
:root[data-skin="crt"] .xp-barra{border:2px solid color-mix(in srgb,var(--f) 55%,transparent);border-radius:2px;background:#000}
:root[data-skin="crt"] .xp-barra i{box-shadow:0 0 8px var(--fglow)}
:root[data-skin="crt"] .pantalla{background:#000;color:var(--f);border:1px solid var(--border);border-radius:2px;text-shadow:0 0 6px var(--fglow)}
:root[data-skin="crt"] .codigo{border-radius:2px}
:root[data-skin="crt"] .caja{border-radius:2px}
:root[data-skin="crt"] .fb{border-radius:4px}
:root[data-skin="crt"] .montaje,:root[data-skin="crt"] .banco,:root[data-skin="crt"] .aviso-modelo{border-radius:2px}

/* botones: teclas con relieve. Luz arriba/izquierda, sombra abajo/derecha; al pulsar se hunden. */
:root[data-skin="crt"] .modo,:root[data-skin="crt"] .chip,:root[data-skin="crt"] .btn,:root[data-skin="crt"] select{
  font-family:'VT323',monospace;font-size:1.15rem;font-weight:400;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;
  border:2px solid;border-radius:3px;padding:.3rem .8rem;color:var(--f);text-shadow:none;
  background:color-mix(in srgb,var(--f) 17%,var(--fbg));
  border-color:color-mix(in srgb,var(--f) 62%,#fff) color-mix(in srgb,var(--f) 14%,#000) color-mix(in srgb,var(--f) 14%,#000) color-mix(in srgb,var(--f) 62%,#fff);
  box-shadow:1px 1px 0 #000}
:root[data-skin="crt"] .chip{padding:.2rem .65rem;font-size:1.05rem}
:root[data-skin="crt"] .modo:hover,:root[data-skin="crt"] .chip:hover,:root[data-skin="crt"] .btn:hover:not(:disabled){background:color-mix(in srgb,var(--f) 27%,var(--fbg))}
:root[data-skin="crt"] .modo:active,:root[data-skin="crt"] .chip:active,:root[data-skin="crt"] .btn:active:not(:disabled){
  border-color:color-mix(in srgb,var(--f) 14%,#000) color-mix(in srgb,var(--f) 62%,#fff) color-mix(in srgb,var(--f) 62%,#fff) color-mix(in srgb,var(--f) 14%,#000);
  transform:translate(1px,1px);box-shadow:none}
/* hundidos: modo activo y chip actual */
:root[data-skin="crt"] .modo[aria-pressed="true"],:root[data-skin="crt"] .tab[aria-selected="true"],:root[data-skin="crt"] .chip[aria-current="true"]{
  background:color-mix(in srgb,var(--f) 40%,var(--fbg));color:#fff;text-shadow:0 0 6px var(--fglow);
  border-color:color-mix(in srgb,var(--f) 14%,#000) color-mix(in srgb,var(--f) 62%,#fff) color-mix(in srgb,var(--f) 62%,#fff) color-mix(in srgb,var(--f) 14%,#000);
  transform:translate(1px,1px);box-shadow:none}
/* accion principal: tecla encendida */
:root[data-skin="crt"] .btn.primario{background:var(--f);color:var(--fbg);font-weight:400;
  border-color:color-mix(in srgb,var(--f) 40%,#fff) color-mix(in srgb,var(--f) 55%,#000) color-mix(in srgb,var(--f) 55%,#000) color-mix(in srgb,var(--f) 40%,#fff)}
:root[data-skin="crt"] .btn.primario:hover:not(:disabled){background:color-mix(in srgb,var(--f) 82%,#fff)}
:root[data-skin="crt"] .btn:disabled{opacity:.45}
/* campos: hundidos */
:root[data-skin="crt"] select,:root[data-skin="crt"] input[type=text]{background:#000;
  border-color:color-mix(in srgb,var(--f) 14%,#000) color-mix(in srgb,var(--f) 55%,#fff) color-mix(in srgb,var(--f) 55%,#fff) color-mix(in srgb,var(--f) 14%,#000);box-shadow:none}
:root[data-skin="crt"] input[type=text]{font-family:'DM Mono',monospace;border:2px solid;border-radius:2px;color:var(--f);caret-color:var(--f);text-shadow:0 0 5px var(--fglow)}
:root[data-skin="crt"] select option{background:var(--fbg);color:var(--f)}
:root[data-skin="crt"] input[type=checkbox]{accent-color:var(--f)}
/* piezas de Construir: teclas planas con borde interior */
:root[data-skin="crt"] .bloque{border-radius:2px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.16),inset -1px -1px 0 rgba(0,0,0,.6)}
:root[data-skin="crt"] .bloque.fantasma{box-shadow:0 8px 22px var(--fglow)}
:root[data-skin="crt"] .cara img{filter:drop-shadow(0 0 1px rgba(255,255,255,.7)) drop-shadow(0 0 4px var(--fglow))}
.modos{margin-bottom:.9rem}
/* una caja (variable) se pinta como una cajita; un valor (numero, texto) va suelto */
.v{color:var(--var);background:color-mix(in srgb,var(--var) 13%,transparent);border:1px solid color-mix(in srgb,var(--var) 50%,transparent);border-radius:4px;padding:0 .28em;margin:0 .04em}
.glosario{margin:.2rem 0 .6rem;border:1px dashed var(--border);border-radius:8px;padding:.35rem .75rem}
.glosario summary{cursor:pointer;font-weight:700;padding:.25rem 0}
.glosario p{margin:.45rem 0 .2rem}
.glosario code,.leyenda .v,.leyenda .n,.leyenda .s,.glosario .v{font-family:'DM Mono',monospace;font-size:.9em}
.leyenda{font-size:.85rem;color:var(--muted);margin:.2rem 0 .7rem}
.ayudas{margin-top:1.1rem}
.ayudas .sec{margin-bottom:.4rem}
/* CRT es un boton: tocarlo reacciona (sorpresa, tristeza, enfado). Nunca reacciona a los errores de nadie. */
.cara{cursor:pointer;color:inherit;font:inherit}
.cara:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:14px}
@media(prefers-reduced-motion:no-preference){.cara img{transition:transform .15s ease}.cara:hover img{transform:translateY(-2px)}.cara:active img{transform:translateY(1px)}}
/* ── Ayudas: reserva con casillas y pregunta de recarga ── */
.hud-ay{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;flex-basis:100%}
.hud-et{font:.8rem 'DM Mono',monospace;color:var(--muted)}
.ay-casillas{display:flex;gap:.25rem}
.ay-casillas i{width:1rem;height:1rem;border:1px solid var(--border);background:var(--bg);border-radius:3px}
.ay-casillas i.on{background:var(--amber);border-color:var(--amber)}
#ay-txt{font:.78rem 'DM Mono',monospace;color:var(--muted)}
#b-recarga{padding:.25rem .8rem;font-size:.8rem}
#quiz{width:min(36rem,92vw);border:2px solid var(--magenta);border-radius:12px;background:var(--surface);color:var(--text);padding:1.2rem 1.3rem}
#quiz::backdrop{background:rgba(0,0,0,.68)}
#quiz h3{margin:0 0 .3rem;font:600 1.15rem 'Space Grotesk',sans-serif}
#quiz .codigo{margin:.5rem 0}
.quiz-p{font-weight:700;margin:.6rem 0 .3rem}
.quiz-op{display:block;width:100%;min-height:2.75rem;text-align:left;margin:.4rem 0;border-radius:10px}
.quiz-op.acierto{border-color:var(--green)}.quiz-op.fallo{opacity:.7}.quiz-op.elegida{outline:2px solid var(--focus);outline-offset:2px}
.quiz-op.acierto::before{content:"✓ ";font-weight:700;color:var(--green)}.quiz-op.fallo::before{content:"✗ ";font-weight:700}
:root[data-skin="crt"] .hud-et,:root[data-skin="crt"] #ay-txt{font-family:'VT323',monospace;font-size:1.05rem}
:root[data-skin="crt"] .ay-casillas i{border-radius:1px;border-color:color-mix(in srgb,var(--f) 40%,transparent);background:#000}
:root[data-skin="crt"] .ay-casillas i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 6px var(--fglow)}
:root[data-skin="crt"] #quiz{border-radius:6px;background:var(--fbg2);box-shadow:0 0 0 3px #000,0 0 24px var(--fglow)}
:root[data-skin="crt"] #quiz h3{font:400 1.5rem 'VT323',monospace;text-transform:uppercase}
:root[data-skin="crt"] .quiz-op{border-radius:3px;text-transform:none}
/* ── Pantalla estrecha: recorrido guiado Elegir → Reto ──
   En pantalla ancha no cambia nada (dos columnas, todo a la vista). En estrecha hay dos pantallas:
   ELEGIR (nivel, XP, modos y lista de retos) y RETO (consigna, programa, piezas y botones juntos).
   La estructura es la misma: solo cambia lo que se ve, segun html[data-pantalla]. */
.crt-contenido{position:relative}
.tira,.plegar,.ayudas-btn{display:none}
@media(max-width:700px){
  :root{--tap:2.75rem}
  /* ── plegar el subtitulo (misma idea y preferencia, hpk-compacto, que la tabla periodica) ── */
  :root[data-pantalla="elegir"] .plegar{display:inline-flex;align-items:center;justify-content:center;position:absolute;top:.7rem;right:.7rem;z-index:2;
    min-width:2.2rem;min-height:2.2rem;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.85rem}
  :root[data-pantalla="elegir"] h1{padding-right:2.8rem}
  :root[data-compacto="si"][data-pantalla="elegir"] .sub{display:none}
  :root[data-compacto="si"] .plegar{transform:none}
  /* ── ELEGIR: la lista de retos, una fila por reto ── */
  :root[data-pantalla="elegir"] .grid,:root[data-pantalla="elegir"] .salto{display:none}
  :root[data-pantalla="elegir"] .modo{flex:1 1 auto;min-height:var(--tap)}
  :root[data-pantalla="elegir"] .bloques{flex-wrap:nowrap}
  :root[data-pantalla="elegir"] .tab{flex:1 1 0;min-width:0}
  :root[data-pantalla="elegir"] .temas{gap:.2rem;margin-bottom:.4rem}
  :root[data-pantalla="elegir"] .tema{flex-direction:column;align-items:stretch;gap:.35rem;margin-bottom:.5rem}
  :root[data-pantalla="elegir"] .tema-n{min-width:0}
  :root[data-pantalla="elegir"] .chip{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:var(--tap);text-align:left;padding-left:.8rem;padding-right:.8rem}
  :root[data-pantalla="elegir"] .chip.ok::after{margin-left:auto;padding-left:.6rem}
  /* ── RETO: lo de uso inmediato, junto ── */
  :root[data-pantalla="reto"] .topbar,:root[data-pantalla="reto"] .sub,:root[data-pantalla="reto"] .bloques,:root[data-pantalla="reto"] .modos,
  :root[data-pantalla="reto"] .temas,:root[data-pantalla="reto"] .hud-nivel,:root[data-pantalla="reto"] .plegar,
  :root[data-pantalla="reto"] #xp-rango,:root[data-pantalla="reto"] #ay-txt,:root[data-pantalla="reto"] .hud-et{display:none}
  :root[data-pantalla="reto"] h1{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :root[data-pantalla="reto"] .wrap{padding-top:.6rem}
  :root[data-pantalla="reto"] .tira{display:flex;align-items:center;gap:.5rem;margin:0 0 .5rem}
  :root[data-pantalla] .tira .btn{min-height:2.5rem;padding:.2rem .55rem;font-size:1rem;white-space:nowrap}
  :root[data-pantalla="reto"] #v-construir .fila .btn{flex:1 1 auto;min-height:var(--tap)}
  :root[data-pantalla="reto"] #v-construir .fila .primario{flex:1 1 100%}
  .tira-n{flex:1;text-align:center;font:.78rem 'DM Mono',monospace;color:var(--muted);white-space:nowrap}
  :root[data-skin="crt"] .tira-n{font-family:'VT323',monospace;font-size:1.05rem;letter-spacing:.05em}
  .tira-modo{position:relative}
  .tira-menu{position:absolute;right:0;top:calc(100% + .3rem);z-index:6;display:flex;flex-direction:column;gap:.3rem;padding:.4rem;min-width:12rem;
    background:var(--surface);border:1px solid var(--magenta);border-radius:8px}
  :root[data-skin="crt"] .tira-menu{background:var(--fbg2);border-radius:3px;box-shadow:0 0 0 2px #000,0 0 14px var(--fglow)}
  .tira-menu .btn{width:100%;text-align:left;min-height:var(--tap)}
  .tira-menu .btn[aria-pressed="true"]{border-color:var(--magenta);background:var(--magenta-soft)}
  :root[data-pantalla="reto"] .hud{padding:.35rem .6rem;margin:0 0 .5rem;gap:.3rem .8rem}
  :root[data-pantalla="reto"] .hud-xp{flex:1 1 9rem}
  :root[data-pantalla="reto"] .hud-ay{flex-basis:auto}
  /* la tarjeta del reto es la rejilla entera; sus dos paneles se aplanan para poder reordenarlos */
  :root[data-pantalla="reto"] .grid{display:flex;flex-direction:column;position:relative;padding:.8rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:14px}
  :root[data-skin="crt"][data-pantalla="reto"] .grid{border-radius:6px;background:color-mix(in srgb,var(--f) 5%,var(--fbg))}
  :root[data-pantalla="reto"] .grid>.panel,:root[data-pantalla="reto"] #montaje-wrap{display:contents}
  /* CRT va en la esquina; el titulo le deja el sitio y la consigna queda debajo, a todo el ancho */
  :root[data-pantalla="reto"] #ej-titulo{order:1;padding-right:5.8rem;min-height:4.4rem}
  :root[data-pantalla="reto"] #ej-consigna{order:2;margin-bottom:.6rem}
  :root[data-pantalla="reto"] #entrada{order:2}
  :root[data-pantalla="reto"] #codigo,:root[data-pantalla="reto"] #err-codigo{order:3}
  :root[data-pantalla="reto"] #montaje-wrap>.sec,:root[data-pantalla="reto"] #montaje{order:4}
  :root[data-pantalla="reto"] #montaje{min-height:5rem}
  :root[data-pantalla="reto"] #v-predecir,:root[data-pantalla="reto"] #v-construir{order:5}
  /* Mirar: los botones de paso van pegados al programa; lo que cambia (cajas, pantalla, nota) cuelga debajo */
  :root[data-pantalla="reto"] #v-mirar{display:contents}
  :root[data-pantalla="reto"] #v-mirar>*{order:6}
  :root[data-pantalla="reto"] #aviso-modelo,:root[data-pantalla="reto"] #pista-mirar{order:4}
  :root[data-pantalla="reto"] #v-mirar>.fila:last-child{order:5;display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.2rem 0 .6rem}
  :root[data-pantalla="reto"] #v-mirar>.fila:last-child .btn{min-height:var(--tap);padding-left:.4rem;padding-right:.4rem}
  :root[data-pantalla="reto"] #v-mirar>.fila:first-child{order:7;margin-top:.8rem}
  :root[data-pantalla="reto"] #montaje-wrap>.hint{order:7;margin:.6rem 0 0}
  :root[data-pantalla="reto"] #ayudas{order:9}
  :root[data-pantalla="reto"] #mascota-fila{position:absolute;top:.4rem;right:.5rem;margin:0}
  :root[data-pantalla="reto"] .cara img{height:80px}
  :root[data-pantalla="reto"] .mascota small{display:none}
  /* ── Ayudas: un boton plegado debajo del trabajo ── */
  :root[data-pantalla="reto"] .ayudas-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:var(--tap);text-align:left;text-transform:none}
  :root[data-pantalla="reto"] .ayudas{margin-top:.8rem}
  :root[data-pantalla="reto"] #ayudas-cuerpo{display:none;margin-top:.5rem}
  :root[data-pantalla="reto"] .ayudas.abierto #ayudas-cuerpo{display:block}
  :root[data-pantalla="reto"] #ayudas-cuerpo>.sec{display:none}
  .ayudas-dot{color:var(--amber)}
  /* movil muy estrecho (320 px): la tira del reto tiene que caber sin salirse */
  @media(max-width:360px){
    :root[data-pantalla] .tira{gap:.25rem}
    :root[data-pantalla] .tira .btn{padding:.2rem .35rem;font-size:.88rem;letter-spacing:.02em}
    .tira-n{font-size:.66rem;letter-spacing:0;min-width:0;overflow:hidden}
    :root[data-skin="crt"] .tira-n{font-size:.88rem;letter-spacing:0}
  }
  [tabindex="-1"]:focus{outline:none}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="sr" id="anuncio" aria-live="polite"></div>
<a class="salto" href="#ej-titulo" data-t="salto.reto"></a>
<div class="wrap">
  <nav class="topbar" aria-label="hAppYpUkIng Lab">
    <a href="../index.html">← inicio</a><span aria-hidden="true">·</span><span>hAppYpUkIng · Lab</span>
  </nav>
  <main id="contenido">
  <div class="crt">
   <div class="crt-bisel">
    <div class="crt-pantalla">
     <div class="crt-contenido">
  <button type="button" class="plegar" id="b-plegar" aria-expanded="true" aria-label="">▲</button>
  <div class="tira" id="tira">
    <button type="button" class="btn" id="b-elegir" data-t="tira.elegir"></button>
    <span class="tira-n" id="tira-n"></span>
    <span class="tira-modo">
      <button type="button" class="btn" id="b-modo" aria-haspopup="true" aria-expanded="false"></button>
      <div class="tira-menu" id="tira-menu" role="group" data-t-aria="modo.aria" hidden>
        <button type="button" class="btn" data-m="construir" data-t="modo.construir"></button>
        <button type="button" class="btn" data-m="predecir" data-t="modo.predecir"></button>
        <button type="button" class="btn" data-m="mirar" data-t="modo.mirar"></button>
      </div>
    </span>
  </div>
  <h1 data-t="titulo"></h1>
  <p class="sub" data-th="subtitulo"></p>

  <div class="hud">
    <div class="hud-nivel">
      <label for="sel-nivel" data-t="nivel.etiqueta"></label>
      <select id="sel-nivel"></select>
    </div>
    <div class="hud-xp">
      <div class="xp-barra" id="xp-barra" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1" data-t-aria="xp.aria"><i></i></div>
      <span id="xp-txt"></span>
      <span class="xp-rango" id="xp-rango"></span>
    </div>
    <div class="hud-ay">
      <span class="hud-et" data-t="ay.etiqueta"></span>
      <div class="ay-casillas" id="ay-casillas" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="5" data-t-aria="ay.aria"></div>
      <span id="ay-txt"></span>
      <button type="button" class="btn" id="b-recarga" data-t="ay.recargar"></button>
    </div>
  </div>
  <div class="modos" role="group" data-t-aria="modo.aria">
    <button class="modo" id="m-construir" aria-pressed="true" data-t="modo.construir"></button>
    <button class="modo" id="m-predecir" aria-pressed="false" data-t="modo.predecir"></button>
    <button class="modo" id="m-mirar" aria-pressed="false" data-t="modo.mirar"></button>
  </div>
  <div class="bloques" id="bloques" role="tablist" data-t-aria="bloques.aria"></div>
  <div class="temas" id="temas"></div>
  <p class="hint sinsel" id="sinsel" data-t="sinsel.texto"></p>

  <div class="grid">
    <section class="panel" aria-labelledby="ej-titulo">
      <h2 id="ej-titulo" tabindex="-1"></h2>
      <p class="consigna" id="ej-consigna"></p>
      <p class="entrada" id="entrada" hidden></p>
      <div class="codigo" id="codigo" role="group" tabindex="0" data-t-aria="programa.aria"></div>
      <p class="hint" id="err-codigo" role="alert" hidden></p>
      <div id="montaje-wrap" hidden>
        <p class="sec" data-t="cons.montaje"></p>
        <div class="montaje" id="montaje" role="group" data-t-aria="cons.aria.montaje"></div>
        <p class="hint" data-t="cons.instr"></p>
      </div>
      <div class="ayudas" id="ayudas">
        <button type="button" class="btn ayudas-btn" id="b-ayudas" aria-expanded="false" aria-controls="ayudas-cuerpo"></button>
        <div id="ayudas-cuerpo">
          <p class="sec" data-t="ayudas.titulo"></p>
          <details class="glosario" id="glosario"><summary id="gl-titulo"></summary><p id="gl-texto"></p></details>
          <details class="glosario" id="aclara"><summary data-t="ac.titulo"></summary><p data-th="ac.texto"></p></details>
          <details class="glosario" id="nota-pseudo"><summary data-t="np.titulo"></summary><p data-th="np.texto"></p></details>
        </div>
      </div>
    </section>

    <section class="panel" id="lado">
      <div class="mascota" id="mascota-fila"><button type="button" class="cara" id="cara" data-estado="idle" data-t-aria="crt.tocar"><img id="crt-img" alt="" width="119" height="120" data-pose="idle" src="../assets/crt/crt-idle.png"></button><small data-t="mascota.nota"></small></div>
      <!-- PREDECIR -->
      <div id="v-predecir">
        <form id="form-pred" autocomplete="off">

<!-- ═══════════════════════ MOTOR ═══════════════════════
     Sin frases. Errores y notas de la traza salen como {id, p}; la app les busca el texto.
     (Las palabras del pseudocodigo —mientras, si, verdadero…— son el LENGUAJE, no la
     interfaz: son la unica excepcion, y se podran sacar a un LEXICO por idioma.) -->
<script id="motor">
/* ==MOTOR== */
const MOTOR = (function () {
  'use strict';
  const LIMITE_PASOS = 500;
  const KW = ['mientras','hacer','si','entonces','sino','fin','para','desde','hasta','mostrar','constante','leer','segun','caso','repetir','y','o','no'];
  const COLGADO = { colgado: true };
  const ID0 = /[A-Za-z_ÁÉÍÓÚáéíóúÑñÜü]/, IDN = /[A-Za-z_ÁÉÍÓÚáéíóúÑñÜü0-9]/;

  function fallo(id, linea, p) { const e = new Error(id); e.id = id; e.p = p || {}; e.linea = linea; e.deMotor = true; return e; }
  const errorDe = e => ({ id: e.id, p: e.p, linea: e.linea });

  // ── Lexico ──────────────────────────────────────────────
  function tokenizar(s, n) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i], d = s.slice(i, i + 2);
      if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
      if (c === '#' || d === '//') break;
      if (c >= '0' && c <= '9') {
        let j = i; while (j < s.length && ((s[j] >= '0' && s[j] <= '9') || s[j] === '.')) j++;
        t.push({ t: 'num', v: parseFloat(s.slice(i, j)) }); i = j; continue;
      }
      if (c === '"') {
        const j = s.indexOf('"', i + 1);
        if (j < 0) throw fallo('comillas', n);
        t.push({ t: 'str', v: s.slice(i + 1, j) }); i = j + 1; continue;
      }
      if (ID0.test(c)) {
        let j = i; while (j < s.length && IDN.test(s[j])) j++;
        const w = s.slice(i, j), l = w.toLowerCase();
        if (l === 'verdadero' || l === 'falso') t.push({ t: 'num', v: l === 'verdadero' });
        else { const l2 = l === 'según' ? 'segun' : l; t.push(KW.includes(l2) ? { t: 'kw', v: l2 } : { t: 'id', v: w }); }
        i = j; continue;
      }
      if (c === '←' || d === '<-' || d === ':=') { t.push({ t: 'asig' }); i += c === '←' ? 1 : 2; continue; }
      if (d === '<=' || d === '>=' || d === '!=' || d === '==') { t.push({ t: 'cmp', v: d === '==' ? '=' : d }); i += 2; continue; }
      if (c === '≤') { t.push({ t: 'cmp', v: '<=' }); i++; continue; }
      if (c === '≥') { t.push({ t: 'cmp', v: '>=' }); i++; continue; }
      if (c === '≠') { t.push({ t: 'cmp', v: '!=' }); i++; continue; }
      if (c === '<' || c === '>' || c === '=') { t.push({ t: 'cmp', v: c }); i++; continue; }
      if (c === ',') { t.push({ t: 'coma', v: ',' }); i++; continue; }       // «caso 6, 7 entonces»
      if ('+-*/%'.includes(c)) { t.push({ t: 'op', v: c }); i++; continue; }
      if (c === '(' || c === ')') { t.push({ t: 'par', v: c }); i++; continue; }
      throw fallo('simbolo', n, { c });
    }
    // «y», «o» y «no» son operadores SOLO entre operandos; en cualquier otro
    // sitio son nombres de variable (y es la variable mas comun en mates).
    const cierra = x => x && (x.t === 'num' || x.t === 'str' || x.t === 'id' || (x.t === 'par' && x.v === ')'));
    const abre = x => x && (x.t === 'num' || x.t === 'str' || x.t === 'id' || (x.t === 'par' && x.v === '(') ||
      (x.t === 'op' && x.v === '-') || (x.t === 'kw' && x.v === 'no'));
    t.forEach((x, k) => {
      if (x.t !== 'kw' || (x.v !== 'y' && x.v !== 'o' && x.v !== 'no')) return;
      const op = x.v === 'no' ? abre(t[k + 1]) && !cierra(t[k - 1]) : cierra(t[k - 1]) && abre(t[k + 1]);
      if (!op) x.t = 'id';
    });
    return t;
  }

  // ── Expresiones ─────────────────────────────────────────
  function parseExpr(t, n) {
    let p = 0;
    const es = (tipo, v) => t[p] && t[p].t === tipo && (v === undefined || t[p].v === v);
    function eO() { let a = eY(); while (es('kw', 'o')) { p++; a = { k: 'bin', op: 'o', a, b: eY() }; } return a; }
    function eY() { let a = eNo(); while (es('kw', 'y')) { p++; a = { k: 'bin', op: 'y', a, b: eNo() }; } return a; }
    function eNo() { if (es('kw', 'no')) { p++; return { k: 'no', a: eNo() }; } return eCmp(); }
    function eCmp() { const a = eSuma(); if (es('cmp')) { const op = t[p++].v; return { k: 'bin', op, a, b: eSuma() }; } return a; }
    function eSuma() { let a = eProd(); while (es('op', '+') || es('op', '-')) { const op = t[p++].v; a = { k: 'bin', op, a, b: eProd() }; } return a; }
    function eProd() { let a = eUn(); while (es('op', '*') || es('op', '/') || es('op', '%')) { const op = t[p++].v; a = { k: 'bin', op, a, b: eUn() }; } return a; }
    function eUn() { if (es('op', '-')) { p++; return { k: 'un', a: eUn() }; } return eAtomo(); }
    function eAtomo() {
      const x = t[p++];
      if (!x) throw fallo('expr-a-medias', n);
      if (x.t === 'num') return { k: 'num', v: x.v };
      if (x.t === 'str') return { k: 'str', v: x.v };
      // conversiones: numero(...) y texto(...). Sin paréntesis detrás, son nombres de caja como cualquier otro.
      if (x.t === 'id' && es('par', '(') && ['numero', 'número', 'texto'].includes(x.v.toLowerCase())) {
        p++; const a = eO();
        if (!es('par', ')')) throw fallo('falta-parentesis', n);
        p++; return { k: 'fn', f: x.v.toLowerCase() === 'texto' ? 'texto' : 'numero', a };
      }
      if (x.t === 'id') return { k: 'var', n: x.v };
      if (x.t === 'par' && x.v === '(') {
        const e = eO();
        if (!es('par', ')')) throw fallo('falta-parentesis', n);
        p++; return e;
      }
      throw fallo('no-esperaba', n, { x: x.v !== undefined ? x.v : '←' });
    }
    if (!t.length) throw fallo('falta-expr', n);
    const e = eO();
    if (p < t.length) throw fallo('sobra', n);
    return e;
  }

  const PREC = { o: 1, y: 2, '=': 4, '!=': 4, '<': 4, '>': 4, '<=': 4, '>=': 4, '+': 5, '-': 5, '*': 6, '/': 6, '%': 6 };
  function fmt(v) {
    if (v === true) return 'verdadero';
    if (v === false) return 'falso';
    if (typeof v === 'number') return String(+v.toFixed(10));
    return String(v);
  }
  // Con comillas cuando es un texto: es lo que enseñan las cajas de Mirar (la pantalla, en cambio, muestra el texto a secas).
  const fmtV = v => (typeof v === 'string' ? '"' + v + '"' : fmt(v));
  const tipoDe = v => (typeof v === 'boolean' ? 'sino' : typeof v === 'string' ? 'texto' : 'numero');
  // Malentendido «las comillas no cambian nada»: un texto que parece número se trata como número.
  const suelto = x => (typeof x === 'string' && x.trim() !== '' && isFinite(+x) ? +x : x);
  function txt(e, prec) {
    prec = prec || 0;
    switch (e.k) {
      case 'num': return fmt(e.v);
      case 'str': return '"' + e.v + '"';
      case 'var': return e.n;
      case 'fn': return e.f + '(' + txt(e.a) + ')';
      case 'un': return '-' + txt(e.a, 7);
      case 'no': return 'no ' + txt(e.a, 3);
      default: {
        const pr = PREC[e.op], s = txt(e.a, pr) + ' ' + e.op + ' ' + txt(e.b, pr + 1);
        return pr < prec ? '(' + s + ')' : s;
      }
    }
  }
  function usaVars(e, set) {
    set = set || new Set();
    if (e.k === 'var') set.add(e.n);
    else { if (e.a) usaVars(e.a, set); if (e.b) usaVars(e.b, set); }
    return set;
  }

  // «caso 6, 7 entonces»: los valores del caso, separados por comas (las comas dentro de paréntesis no cuentan)
  function valoresDeCaso(t, n) {
    const partes = []; let cur = [], prof = 0;
    for (const x of t.slice(1, -1)) {
      if (x.t === 'par') prof += x.v === '(' ? 1 : -1;
      if (x.t === 'coma' && prof === 0) { partes.push(cur); cur = []; } else cur.push(x);
    }
    partes.push(cur);
    if (partes.some(x => !x.length)) throw fallo('caso-forma', n);
    return partes.map(x => parseExpr(x, n));
  }

  // ── Sentencias ──────────────────────────────────────────
  function parsear(codigo) {
    const lineas = codigo.split('\n');
    let pos = 0;
    function bloque(abiertoEn, modo) {
      const out = [];
      while (pos < lineas.length) {
        const n = pos + 1, t = tokenizar(lineas[pos], n);
        if (!t.length) { pos++; continue; }
        const k = t[0].t === 'kw' ? t[0].v : null;
        if (k === 'fin') { if (!abiertoEn) throw fallo('fin-suelto', n); return { out, cierre: 'fin' }; }
        if (k === 'sino') { if (!abiertoEn) throw fallo('sino-suelto', n); return { out, cierre: 'sino' }; }
        if (k === 'hasta') {                 // un «hasta» solo cierra el bloque de un «repetir» (el «hasta» de «para» no empieza la línea)
          if (modo === 'repetir') return { out, cierre: 'hasta' };
          if (abiertoEn) throw fallo('falta-fin', abiertoEn);
          throw fallo('hasta-suelto', n);
        }
        if (k === 'caso') {                  // un «caso» solo cierra el bloque del caso anterior dentro de un «segun»
          if (modo === 'segun') return { out, cierre: 'caso' };
          if (abiertoEn) throw fallo('falta-fin', abiertoEn);
          throw fallo('caso-suelto', n);
        }
        pos++;
        const ultimo = t[t.length - 1], esKw = (x, v) => x && x.t === 'kw' && x.v === v;
        if (k === 'mostrar') { out.push({ tipo: 'mostrar', linea: n, expr: parseExpr(t.slice(1), n) }); continue; }
        if (k === 'constante') {
          if (!(t[1] && t[1].t === 'id' && t[2] && t[2].t === 'asig')) throw fallo('const-forma', n);
          out.push({ tipo: 'const', linea: n, nombre: t[1].v, expr: parseExpr(t.slice(3), n) }); continue;
        }
        if (k === 'leer') {
          if (!(t.length === 2 && t[1].t === 'id')) throw fallo('leer-forma', n);
          out.push({ tipo: 'leer', linea: n, nombre: t[1].v }); continue;
        }
        if (k === 'mientras') {
          if (!esKw(ultimo, 'hacer')) throw fallo('falta-hacer', n);
          const cond = parseExpr(t.slice(1, -1), n), b = bloque(n);
          if (b.cierre !== 'fin') throw fallo('mientras-sino', n);
          pos++; out.push({ tipo: 'mientras', linea: n, cond, cuerpo: b.out }); continue;
        }
        if (k === 'si') {
          if (!esKw(ultimo, 'entonces')) throw fallo('falta-entonces', n);
          const cond = parseExpr(t.slice(1, -1), n), a = bloque(n); let sino = null;
          if (a.cierre === 'sino') { pos++; const b = bloque(n); sino = b.out; }
          pos++; out.push({ tipo: 'si', linea: n, cond, entonces: a.out, sino }); continue;
        }
        if (k === 'para') {
          const iD = t.findIndex(x => esKw(x, 'desde')), iH = t.findIndex(x => esKw(x, 'hasta'));
          if (t[1] && t[1].t !== 'id' || iD !== 2 || iH < 0 || !esKw(ultimo, 'hacer')) throw fallo('para-forma', n);
          const desde = parseExpr(t.slice(3, iH), n), hasta = parseExpr(t.slice(iH + 1, -1), n), b = bloque(n);
          if (b.cierre !== 'fin') throw fallo('para-sino', n);
          pos++; out.push({ tipo: 'para', linea: n, v: t[1].v, desde, hasta, cuerpo: b.out }); continue;
        }
        if (k === 'repetir') {
          if (t.length !== 1) throw fallo('repetir-forma', n);
          const b = bloque(n, 'repetir');
          if (b.cierre !== 'hasta') throw fallo('repetir-cierre', pos + 1);       // se cerró con «fin» o «sino»
          const lineaHasta = pos + 1, th = tokenizar(lineas[pos], lineaHasta), cond = parseExpr(th.slice(1), lineaHasta);
          pos++; out.push({ tipo: 'repetir', linea: n, lineaHasta, cond, cuerpo: b.out }); continue;
        }
        if (k === 'segun') {
          if (!esKw(ultimo, 'hacer')) throw fallo('falta-hacer', n);
          const sel = parseExpr(t.slice(1, -1), n), casos = []; let sino = null;
          for (;;) {
            while (pos < lineas.length && !tokenizar(lineas[pos], pos + 1).length) pos++;      // líneas vacías
            if (pos >= lineas.length) throw fallo('falta-fin', n);
            const n2 = pos + 1, t2 = tokenizar(lineas[pos], n2), k2 = t2[0].t === 'kw' ? t2[0].v : null;
            if (k2 === 'fin') { pos++; break; }
            if (k2 === 'caso') {
              if (sino) throw fallo('caso-tras-sino', n2);
              if (!esKw(t2[t2.length - 1], 'entonces')) throw fallo('falta-entonces', n2);
              const valores = valoresDeCaso(t2, n2); pos++;
              casos.push({ linea: n2, valores, cuerpo: bloque(n, 'segun').out });
            } else if (k2 === 'sino') {
              if (sino) throw fallo('caso-tras-sino', n2);
              if (t2.length > 1) throw fallo('sobra', n2);
              pos++; sino = { linea: n2, cuerpo: bloque(n, 'segun').out };
            } else throw fallo('segun-falta-caso', n2);
          }
          out.push({ tipo: 'segun', linea: n, sel, casos, sino }); continue;
        }
        if (t[0].t === 'id' && t[1] && t[1].t === 'asig') {
          out.push({ tipo: 'asig', linea: n, nombre: t[0].v, expr: parseExpr(t.slice(2), n) }); continue;
        }
        if (t.length > 1 && t[1].t === 'asig') throw fallo('asig-izquierda', n);   // «7 ← edad»: la flecha va hacia la caja
        throw fallo('linea-incomprensible', n);
      }
      if (abiertoEn) throw fallo(modo === 'repetir' ? 'falta-hasta' : 'falta-fin', abiertoEn);
      return { out, cierre: null };
    }
    return bloque(0).out;
  }

  // ── Ejecucion (con modelos mentales opcionales) ─────────
  // `entrada`: lo que la persona escribe, en orden, cada vez que el programa hace «leer» (siempre texto)
  function correr(codigo, m, entrada) {
    m = m || {};
    let ast;
    try { ast = parsear(codigo); }
    catch (e) { if (e.deMotor) return { error: errorDe(e), pasos: [], salida: [] }; throw e; }
    const ctx = { env: new Map(), consts: new Set(), out: [], pasos: [], prof: 0, entrada: (entrada || []).map(String) };

    function leer(n, linea) {
      if (!ctx.env.has(n)) throw fallo('sin-valor', linea, { n });
      const v = ctx.env.get(n);
      if (v && v.formula) {
        if (ctx.prof > 25) throw fallo('ciclo', linea);
        ctx.prof++;
        try { return ev(v.formula, linea); } finally { ctx.prof--; }
      }
      return v;
    }
    const LAXO = { '<': '<=', '<=': '<', '>': '>=', '>=': '>' };
    function num(x, linea) { if (typeof x !== 'number') throw fallo('no-calculable', linea, { v: fmt(x) }); return x; }
    function ev(e, linea) {
      switch (e.k) {
        case 'num': case 'str': return e.v;
        case 'var': return leer(e.n, linea);
        case 'fn': {
          const a = ev(e.a, linea);
          if (e.f === 'texto') return fmt(a);
          if (typeof a === 'number') return a;
          if (typeof a === 'string' && a.trim() !== '' && isFinite(+a)) return +a;
          throw fallo('no-numero', linea, { v: fmt(a) });
        }
        case 'un': return -num(ev(e.a, linea), linea);
        case 'no': { const a = ev(e.a, linea); if (typeof a !== 'boolean') throw fallo('no-bool', linea); return !a; }
        default: {
          let op = e.op;
          if (m.limite && LAXO[op]) op = LAXO[op];
          if (op === 'y' || op === 'o') {
            const a = ev(e.a, linea); if (typeof a !== 'boolean') throw fallo('no-bool', linea);
            if (op === 'y' ? !a : a) return a;
            const b = ev(e.b, linea); if (typeof b !== 'boolean') throw fallo('no-bool', linea);
            return b;
          }
          if (m.sumaPrimero && op === '+' && e.a.k === 'bin' && e.a.op === '+') {   // «"Total: " + a + b» con la suma hecha antes que la unión
            const x = ev(e.a.a, linea), y = ev(e.a.b, linea), z = ev(e.b, linea);
            if (typeof x === 'string' && typeof y === 'number' && typeof z === 'number') return x + fmt(y + z);
          }
          let a = ev(e.a, linea), b = ev(e.b, linea);
          if (m.comillasNada) { a = suelto(a); b = suelto(b); }
          switch (op) {
            case '+': return (typeof a === 'string' || typeof b === 'string') ? fmt(a) + fmt(b) : num(a, linea) + num(b, linea);
            case '-': return num(a, linea) - num(b, linea);
            case '*': return num(a, linea) * num(b, linea);
            case '/': if (num(b, linea) === 0) throw fallo('div-cero', linea); return num(a, linea) / b;
            case '%': if (num(b, linea) === 0) throw fallo('div-cero', linea); return num(a, linea) % b;
            case '=': return a === b;
            case '!=': return a !== b;
            case '<': case '>': case '<=': case '>=':
              if (typeof a !== typeof b) throw fallo('no-comparable', linea, { op: e.op });
              return op === '<' ? a < b : op === '>' ? a > b : op === '<=' ? a <= b : a >= b;
          }
        }
      }
    }
    function foto(linea, nota, cambia) {
      if (ctx.pasos.length >= LIMITE_PASOS) throw COLGADO;
      const vars = [];
      ctx.env.forEach((v, nombre) => {
        if (v && v.formula) {
          let val, tp = null; try { const r = leer(nombre, linea); val = fmtV(r); tp = tipoDe(r); } catch (_) { val = '?'; }
          vars.push({ n: nombre, v: val, t: tp, f: txt(v.formula) });
        } else vars.push({ n: nombre, v: fmtV(v), t: tipoDe(v), f: null, c: ctx.consts.has(nombre) });
      });
      ctx.pasos.push({ linea, vars, salida: ctx.out.slice(), nota, cambia: cambia || null });
    }
    function test(cond, linea) {
      const r = ev(cond, linea);
      if (typeof r !== 'boolean') throw fallo('cond-no-bool', linea);
      foto(linea, { id: r ? 'test-si' : 'test-no', p: { c: txt(cond) } });
      return r;
    }
    function bloque(lista) { for (const s of lista) sentencia(s); }
    function sentencia(s) {
      switch (s.tipo) {
        case 'const': {
          if (ctx.env.has(s.nombre)) throw fallo('const-existe', s.linea, { n: s.nombre });
          const val = ev(s.expr, s.linea);
          ctx.env.set(s.nombre, val); ctx.consts.add(s.nombre);
          foto(s.linea, { id: 'const', p: { n: s.nombre, e: txt(s.expr), v: fmtV(val) } }, s.nombre);
          return;
        }
        case 'leer': {
          if (ctx.consts.has(s.nombre)) throw fallo('constante', s.linea, { n: s.nombre });
          if (!ctx.entrada.length) throw fallo('sin-entrada', s.linea);
          let val = ctx.entrada.shift();
          if (m.entradaNumero) val = suelto(val);          // malentendido: «lo que escribe la persona ya llega como número»
          ctx.env.set(s.nombre, val);
          foto(s.linea, { id: 'leer', p: { n: s.nombre, v: fmtV(val) } }, s.nombre);
          return;
        }
        case 'asig': {
          const e = s.expr;
          if (ctx.consts.has(s.nombre)) {                       // una constante no cambia… salvo en el malentendido «es una variable»
            if (!m.constVariable) throw fallo('constante', s.linea, { n: s.nombre });
            ctx.consts.delete(s.nombre);
          }
          if (m.intercambia && e.k === 'var' && e.n !== s.nombre && ctx.env.has(e.n) && ctx.env.has(s.nombre)) {
            const a = ctx.env.get(s.nombre); ctx.env.set(s.nombre, ctx.env.get(e.n)); ctx.env.set(e.n, a);
            foto(s.linea, { id: 'intercambia', p: { a: s.nombre, b: e.n, va: fmtV(leer(s.nombre, s.linea)), vb: fmtV(leer(e.n, s.linea)) } }, s.nombre);
            return;
          }
          if (m.acumula && ctx.env.has(s.nombre) && !usaVars(e).has(s.nombre)) {
            const antes = ctx.env.get(s.nombre), nuevo = ev(e, s.linea);
            if (typeof antes === 'number' && typeof nuevo === 'number') {
              const val = antes + nuevo;
              ctx.env.set(s.nombre, val);
              foto(s.linea, { id: 'acumula', p: { n: s.nombre, e: txt(e), antes: fmt(antes), v: fmt(val) } }, s.nombre);
              return;
            }
          }
          if (m.formula) {
            const us = usaVars(e);
            if (us.size && !us.has(s.nombre)) {
              ctx.env.set(s.nombre, { formula: e });
              foto(s.linea, { id: 'formula', p: { n: s.nombre, e: txt(e) } }, s.nombre);
              return;
            }
          }
          const val = ev(e, s.linea);
          ctx.env.set(s.nombre, val);
          foto(s.linea, { id: 'asig', p: { n: s.nombre, e: txt(e), v: fmtV(val) } }, s.nombre);
          return;
        }
        case 'mostrar': {
          const val = fmt(ev(s.expr, s.linea));
          ctx.out.push(val);
          foto(s.linea, { id: 'mostrar', p: { v: val } });
          return;
        }
        case 'repetir': {
          // primero ejecuta y después pregunta: se sale cuando la condición del «hasta» es verdadera (condición de PARADA).
          // Malentendidos: `hastaMientras` (se repite mientras sea verdadera) y `repetirAntes` (se pregunta antes de ejecutar).
          const parar = () => {
            const r = ev(s.cond, s.lineaHasta);
            if (typeof r !== 'boolean') throw fallo('cond-no-bool', s.lineaHasta);
            foto(s.lineaHasta, { id: r ? 'hasta-si' : 'hasta-no', p: { c: txt(s.cond) } });
            return m.hastaMientras ? !r : r;
          };
          if (m.repetirAntes) { while (!parar()) bloque(s.cuerpo); }
          else { do { bloque(s.cuerpo); } while (!parar()); }
          return;
        }
        case 'segun': {
          // se evalúa UNA vez y se ejecuta solo el primer caso que coincide (comparación como «=»: el tipo cuenta).
          // Malentendido `cae`: tras el caso que coincide siguen ejecutándose los de después (y el sino).
          const v = ev(s.sel, s.linea);
          foto(s.linea, { id: 'segun', p: { e: txt(s.sel), v: fmtV(v) } });
          let entra = false;
          for (const c of s.casos) {
            const lista = c.valores.map(x => txt(x)).join(', ');
            if (!entra) {
              const co = c.valores.some(x => ev(x, c.linea) === v);
              foto(c.linea, { id: co ? 'caso-si' : 'caso-no', p: { l: lista, v: fmtV(v) } });
              if (!co) continue;
              entra = true;
            } else foto(c.linea, { id: 'caso-cae', p: { l: lista } });
            bloque(c.cuerpo);
            if (!m.cae) return;
          }
          if (s.sino && (!entra || m.cae)) { foto(s.sino.linea, { id: entra ? 'caso-cae-sino' : 'caso-otro', p: {} }); bloque(s.sino.cuerpo); return; }
          if (!entra) foto(s.linea, { id: 'caso-nada', p: {} });
          return;
        }
        case 'si': {
          const t = test(s.cond, s.linea);
          if (t) { bloque(s.entonces); if (m.sinoSiempre && s.sino) bloque(s.sino); }
          else if (s.sino) bloque(s.sino);
          return;
        }
        case 'mientras': {
          if (m.alFinal) { let sigue; do { bloque(s.cuerpo); sigue = test(s.cond, s.linea); } while (sigue); }
          else if (m.unaVez) { if (test(s.cond, s.linea)) bloque(s.cuerpo); }
          else { while (test(s.cond, s.linea)) bloque(s.cuerpo); }
          return;
        }
        case 'para': {
          if (ctx.consts.has(s.v)) throw fallo('constante', s.linea, { n: s.v });
          const a = num(ev(s.desde, s.linea), s.linea), b = num(ev(s.hasta, s.linea), s.linea);
          for (let i = a; m.excluye ? i < b : i <= b; i++) {
            ctx.env.set(s.v, i);
            foto(s.linea, { id: 'para', p: { v: s.v, i: fmt(i) } }, s.v);
            bloque(s.cuerpo);
          }
          return;
        }
      }
    }
    let colgado = false, error = null;
    try { bloque(ast); }
    catch (e) {
      if (e === COLGADO) colgado = true;
      else if (e.deMotor) error = errorDe(e);
      else throw e;
    }
    return { pasos: ctx.pasos, salida: ctx.out, colgado, error };
  }

  // ── Malentendidos tipicos (el texto de cada uno vive en TEXTOS: mod.<id>.corto/.diag) ──
  const MODELOS = [
    { id: 'formula',     flags: { formula: true } },
    { id: 'intercambia', flags: { intercambia: true } },
    { id: 'unaVez',      flags: { unaVez: true } },
    { id: 'alFinal',     flags: { alFinal: true } },
    { id: 'limite',      flags: { limite: true } },
    { id: 'excluye',     flags: { excluye: true } },
    { id: 'sinoSiempre', flags: { sinoSiempre: true } },
    { id: 'acumula',     flags: { acumula: true } },
    { id: 'constVariable', flags: { constVariable: true } },
    // `aplica`: solo se propone como causa en programas donde la regla equivocada tiene sentido
    { id: 'comillasNada', flags: { comillasNada: true }, aplica: c => /"/.test(c) && !/\bleer\b/.test(c) },
    { id: 'sumaPrimero',  flags: { sumaPrimero: true }, aplica: c => /"/.test(c) },
    { id: 'entradaNumero', flags: { entradaNumero: true }, aplica: c => /\bleer\b/.test(c) },
    { id: 'cae', flags: { cae: true }, aplica: c => /\bseg(u|ú)n\b/i.test(c) },
    { id: 'hastaMientras', flags: { hastaMientras: true }, aplica: c => /\brepetir\b/.test(c) },
    { id: 'repetirAntes', flags: { repetirAntes: true }, aplica: c => /\brepetir\b/.test(c) }
  ];

  // ── Diagnostico ─────────────────────────────────────────
  function norm(lista) {
    return lista.map(x => String(x).trim().replace(/^"|"$/g, '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''))
      .filter(x => x !== '').map(x => (/^-?\d+(\.\d+)?$/.test(x) ? String(+x) : x));
  }
  function trocear(texto) { return norm(String(texto).split(/[\s,;]+/)); }
  const igual = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  function diagnosticar(codigo, respuesta, entrada) {
    const palabras = sal => trocear(sal.join(' '));
    const real = correr(codigo, null, entrada), esperado = palabras(real.salida), dado = trocear(respuesta);
    if (igual(esperado, dado)) return { correcta: true };
    const causas = [];
    for (const mod of MODELOS) {
      if (mod.aplica && !mod.aplica(codigo)) continue;
      const r = correr(codigo, mod.flags, entrada);
      if (r.error || r.colgado) continue;
      const s = palabras(r.salida);
      if (!igual(s, esperado) && igual(s, dado)) causas.push(mod);
    }
    const mismoConjunto = esperado.length === dado.length && JSON.stringify([...esperado].sort()) === JSON.stringify([...dado].sort());
    return { correcta: false, causas, esperadoN: esperado.length, dadoN: dado.length, mismoConjunto };
  }

  // ── Construccion (problemas de Parsons) ─────────────────
  // Lectura en voz alta de UNA linea: devuelve {id, p} y la app busca «lee.<id>».
  function leerLinea(linea) {
    try {
      const t = tokenizar(linea, 1);
      if (!t.length) return null;
      const k = t[0].t === 'kw' ? t[0].v : null;
      if (k === 'fin' || k === 'sino') return { id: k, p: {} };
      if (k === 'mostrar') {
        const e = parseExpr(t.slice(1), 1);
        return { id: e.k === 'var' ? 'mostrar-caja' : e.k === 'str' ? 'mostrar-texto' : 'mostrar', p: { e: txt(e) } };
      }
      if (k === 'constante') return { id: 'const', p: { n: t[1].v, e: txt(parseExpr(t.slice(3), 1)) } };
      if (k === 'leer') return t[1] ? { id: 'leer', p: { n: t[1].v } } : null;
      if (k === 'repetir') return { id: 'repetir', p: {} };
      if (k === 'hasta') return t.length > 1 ? { id: 'hasta', p: { c: txt(parseExpr(t.slice(1), 1)) } } : null;
      if (k === 'segun') return { id: 'segun', p: { e: txt(parseExpr(t.slice(1, -1), 1)) } };
      if (k === 'caso') return { id: 'caso', p: { l: valoresDeCaso(t, 1).map(x => txt(x)).join(', ') } };
      if (k === 'mientras' || k === 'si') return { id: k, p: { c: txt(parseExpr(t.slice(1, -1), 1)) } };
      if (k === 'para') {
        const iH = t.findIndex(x => x.t === 'kw' && x.v === 'hasta');
        return { id: 'para', p: { v: t[1].v, a: txt(parseExpr(t.slice(3, iH), 1)), b: txt(parseExpr(t.slice(iH + 1, -1), 1)) } };
      }
      if (t[0].t === 'id' && t[1] && t[1].t === 'asig') {
        const e = parseExpr(t.slice(2), 1);
        return { id: e.k === 'var' ? 'asig-caja' : (e.k === 'num' || e.k === 'str') ? 'asig' : 'asig-calculo', p: { n: t[0].v, e: txt(e) } };
      }
    } catch (e) { if (!e.deMotor) throw e; }
    return null;
  }

  // Comprueba un programa montado con piezas. Vale si SE COMPORTA como la solucion:
  // misma salida y mismas cajas al final, con los datos del reto Y con otros datos
  // (`entradas`: linea -> valores alternativos). Asi no cuela un programa que acierta
  // por casualidad (p. ej. un «mostrar "frío"» suelto que solo coincide con 18 grados).
  // `extra.entrada`: lo que escribe la persona en el reto; `extra.alternativas`: otras entradas con las que también tiene que salir lo mismo.
  function comprobarConstruccion(solucion, lineas, entradas, extra) {
    const dato = (extra && extra.entrada) || [];
    if (!lineas.length) return { estado: 'vacio' };
    if (lineas.length < solucion.length) {
      // faltan líneas, pero lo que hay se ejecuta igual: así se puede ver qué hace (y por qué no basta)
      const p = correr(lineas.join('\n'), null, dato);
      return { estado: 'faltan', n: solucion.length, pasos: p.pasos.length, error: p.error, colgado: p.colgado, mio: p.error || p.colgado ? undefined : p.salida };
    }
    const esp = correr(solucion.join('\n'), null, dato), r = correr(lineas.join('\n'), null, dato);
    if (r.error) return { estado: 'error', error: r.error, pasos: r.pasos.length };
    if (r.colgado) return { estado: 'colgado', pasos: r.pasos.length };
    const pasos = r.pasos.length;
    if (!igual(norm(r.salida), norm(esp.salida))) return { estado: 'distinta', mio: r.salida, esperado: esp.salida, pasos };

    const finDe = res => { const m = {}; (res.pasos.length ? res.pasos[res.pasos.length - 1].vars : []).forEach(v => { m[v.n] = v.v; }); return m; };
    const claves = Object.keys(entradas || {}), nEsc = claves.reduce((m, k) => Math.max(m, entradas[k].length), 0);
    const escenarios = [{ datos: '', a: esp, b: r }];
    for (let e = 0; e < nEsc; e++) {
      const cambio = {}, valor = {};
      // «constante X ← 6» y «X ← 6» son la misma linea a efectos de cambiar los datos: si no, un programa que usa
      // una variable en vez de la constante parecería fallar con otros datos cuando solo ha usado otra pieza.
      const sinConst = l => l.trim().replace(/^constante\s+/i, '');
      claves.forEach(k => { const v = entradas[k]; cambio[k] = k.replace(/[-\d.]+\s*$/, String(v[e % v.length])); valor[sinConst(k)] = String(v[e % v.length]); });
      const aplica = l => (Object.prototype.hasOwnProperty.call(valor, sinConst(l)) ? l.replace(/[-\d.]+\s*$/, valor[sinConst(l)]) : l);
      escenarios.push({ datos: claves.map(k => cambio[k]).join(', '),
        a: correr(solucion.map(aplica).join('\n'), null, dato), b: correr(lineas.map(aplica).join('\n'), null, dato) });
    }
    ((extra && extra.alternativas) || []).forEach(alt => escenarios.push({ datos: alt.map(x => '«' + x + '»').join(', '),
      a: correr(solucion.join('\n'), null, alt), b: correr(lineas.join('\n'), null, alt) }));
    for (const sc of escenarios) {
      if (sc.a.error || sc.a.colgado) continue;
      if (!igual(norm(sc.b.salida), norm(sc.a.salida)) || sc.b.error || sc.b.colgado)
        return { estado: 'coincide', datos: sc.datos, mio: sc.b.salida, esperado: sc.a.salida, pasos };
      const fa = finDe(sc.a), fb = finDe(sc.b);
      for (const nombre of Object.keys(fa))
        if (fb[nombre] !== fa[nombre]) return { estado: 'estado', datos: sc.datos, nombre, esperado: fa[nombre], mio: fb[nombre], pasos };
    }
    const clave = l => l.map(x => x.trim()).sort().join('\n');
    if (clave(lineas) !== clave(solucion)) return { estado: 'casi', pasos };
    return { estado: 'ok', igualPlan: lineas.every((l, i) => l.trim() === solucion[i].trim()), pasos };
  }

  return { correr, diagnosticar, leerLinea, comprobarConstruccion, MODELOS, fmt };
})();
/* ==/MOTOR== */
</script>

    'ac.titulo': '¿variable o "variable"?',
    'ac.texto': 'Sin comillas, <span class="v">edad</span> es una variable: se usa el valor que guarda. Entre comillas, <span class="s">"edad"</span> es un texto literal: se usa tal cual. Y <span class="n">7</span> es un número. Por eso <code>mostrar edad</code> y <code>mostrar "edad"</code> hacen cosas distintas.',
    'gl.constantes.titulo': '¿Qué es una constante?',
    'gl.tipos.titulo': '¿Qué es un tipo de dato?',
    'gl.tipos.texto': 'Cada valor tiene un <b>tipo</b>, que dice qué es y qué se puede hacer con él. Un <b>número</b> (<code>7</code>) se puede sumar, restar o comparar. Un <b>texto</b> (<code>"7"</code>, entre comillas) se puede unir con otros textos, pero no sirve para calcular. Un <b>sí/no</b> (<code>verdadero</code> o <code>falso</code>) es el resultado de una pregunta, como <code>t &gt; 20</code>. Aunque se parezcan, <code>7</code> y <code>"7"</code> son valores distintos: con <code>+</code>, los números se suman y los textos se unen.',
    'gl.entrada.titulo': '¿Qué es leer un dato?',
    'gl.entrada.texto': 'Un programa puede <b>pedir un dato</b> a la persona que lo usa. <code>leer nombre</code> espera lo que la persona escribe y lo guarda en la variable <code>nombre</code>. Lo que llega es siempre un <b>texto</b>, aunque sean cifras: para calcular con ello hay que convertirlo con <code>numero(...)</code>. Aquí, lo que escribe la persona aparece indicado encima del programa.',
    'gl.segun.titulo': '¿Qué es un «segun»?',
    'gl.segun.texto': 'Un <code>segun</code> elige entre varios <b>casos</b> según el valor de una expresión. <code>segun dia hacer</code> mira el valor de <code>dia</code> y ejecuta el bloque del <b>primer</b> <code>caso</code> que coincide; después termina, así que nunca se ejecutan dos. Un caso puede reunir varios valores: <code>caso 6, 7 entonces</code>. Si ninguno coincide, se ejecuta el <code>sino</code> (si lo hay). Es una forma más clara de elegir entre muchos valores que encadenar condicionales.',
    'gl.repetir.titulo': '¿Qué es «repetir … hasta»?',
    'gl.repetir.texto': 'Es un bucle que <b>primero ejecuta</b> y <b>después pregunta</b>. <code>repetir … hasta condición</code> ejecuta el bloque y, al llegar al <code>hasta</code>, comprueba la condición: si es <b>verdadera</b>, termina; si es falsa, vuelve a repetir. Por eso el bloque se ejecuta <b>al menos una vez</b>, y la condición dice cuándo <b>parar</b> (en <code>mientras</code>, en cambio, dice cuándo seguir).',
    'gl.repaso1.titulo': '¿Qué repasamos?',
    'gl.repaso1.texto': 'Aquí se mezclan las variables y las constantes. En cada programa, sigue el valor de cada nombre línea a línea: qué cambia, qué se queda igual y qué se copia.',
    'gl.repaso2.titulo': '¿Qué repasamos?',
    'gl.repaso2.texto': 'Aquí se mezclan las decisiones y las repeticiones. Sigue el programa vuelta a vuelta: en cada una, qué pregunta se hace y qué se ejecuta según la respuesta.',
    'gl.constantes.texto': 'Una constante es un nombre con un valor que <b>no cambia</b> mientras se ejecuta el programa. Se crea una sola vez con <code>constante MAXIMO ← 10</code> y después se usa como una variable, pero si el programa intenta darle otro valor, se detiene con un error. Se suele escribir en MAYÚSCULAS para distinguirla.',
    'gl.variables.titulo': '¿Qué es una variable?',
    'gl.variables.texto': 'Una variable es un nombre al que le asignas un valor. Al escribir <code>edad ← 7</code>, el nombre <span class="v">edad</span> pasa a guardar un 7, y puedes cambiarlo cuando quieras asignándole otro.',
    'gl.condicionales.titulo': '¿Qué es un condicional?',
    'gl.condicionales.texto': 'Un condicional es una instrucción que decide: hace una cosa u otra según la respuesta a una pregunta de sí o no (verdadero o falso), como <code>t &gt; 20</code>. A esa pregunta se le llama <b>condición</b>. En <code>si condición entonces … sino … fin</code>, si la respuesta es «verdadero» se ejecuta el primer bloque y, si no, el del <code>sino</code> (si lo hay). Nunca se ejecutan los dos.',
    'gl.bucles.titulo': '¿Qué es un bucle?',
    'gl.bucles.texto': 'Un bucle repite un bloque de instrucciones. <code>mientras condición hacer … fin</code> comprueba la condición (una pregunta de verdadero o falso) ANTES de cada vuelta y repite mientras la respuesta sea «verdadero». <code>para i desde a hasta b</code> cuenta de a hasta b, con los dos extremos incluidos. Dentro tiene que cambiar algo para que la condición deje de cumplirse; si no, el bucle no termina nunca.',

    'mod.formula.corto': 'que «y ← x» guarda la fórmula y se actualiza sola',
    'mod.formula.diag': 'Parece que has leído «y ← x» como «y es siempre lo que valga x». No: guarda el valor que tenía x justo en ese momento, como una foto. Después, cambiar x no cambia el valor de y.',
    'mod.intercambia.corto': 'que «a ← b» intercambia a y b',
    'mod.intercambia.diag': 'Parece que has leído «a ← b» como un intercambio. Solo copia: a recibe el valor de b, y b se queda como estaba. Para intercambiar hace falta una tercera variable.',
    'mod.unaVez.corto': 'que «mientras» funciona como un «si»',
    'mod.unaVez.diag': 'Parece que has tratado «mientras» como un «si»: comprobar una vez y seguir. «Mientras» vuelve a comprobar la condición después de cada vuelta.',
    'mod.alFinal.corto': 'que «mientras» entra una vez antes de comprobar',
    'mod.alFinal.diag': 'Parece que has entrado en el bucle sin comprobar antes. «Mientras» comprueba ANTES de entrar: si no se cumple a la primera, el cuerpo no se ejecuta ni una vez.',
    'mod.limite.corto': 'que «<» incluye el límite (o «<=» no)',
    'mod.limite.diag': 'Parece que has confundido el límite: «<» NO incluye el valor del extremo y «<=» SÍ lo incluye. Mira qué pasa justo en el último valor.',
    'mod.excluye.corto': 'que «hasta» no incluye el último valor',
    'mod.excluye.diag': 'Parece que «hasta 4» ha dejado fuera el 4. En «para … hasta», el último valor SÍ se ejecuta.',
    'mod.acumula.corto': 'que la variable suma lo nuevo a lo que ya tenía',
    'mod.acumula.diag': 'Parece que has sumado el valor nuevo al que ya había. No: una variable guarda un solo valor, y asignar lo sustituye por el nuevo.',
    'mod.comillasNada.corto': 'que las comillas no cambian nada: «"2"» es lo mismo que 2',
    'mod.comillasNada.diag': 'Parece que has tratado un texto entre comillas como si fuera un número. Pero «"2"» es un texto: con «+» se une a otros textos, no se suma, y «"2" = 2» da falso.',
    'mod.sumaPrimero.corto': 'que la suma de los números se hace antes de unirlos al texto',
    'mod.sumaPrimero.diag': 'Parece que has sumado los dos números antes de unirlos al texto. Pero las operaciones se hacen de izquierda a derecha: «"Total: " + a» ya es un texto, y a ese texto se le une b. Para sumar primero hacen falta paréntesis.',
    'mod.entradaNumero.corto': 'que lo que escribe la persona ya llega como número',
    'mod.entradaNumero.diag': 'Parece que has tratado lo que escribe la persona como si ya fueran números. Pero llega siempre como texto: con «+» se une, no se suma, hasta que se convierte con numero(...).',
    'mod.cae.corto': 'que después del caso que coincide se ejecutan también los siguientes',
    'mod.cae.diag': 'Parece que has seguido ejecutando los casos de después del que coincide. Aquí un «segun» ejecuta solo el primer caso que coincide y termina (en algunos lenguajes, como C o Java, hay que escribir «break» para conseguir eso; aquí no hace falta).',
    'mod.hastaMientras.corto': 'que «hasta» repite mientras la condición es verdadera',
    'mod.hastaMientras.diag': 'Parece que has repetido mientras la condición del «hasta» era verdadera. Es al revés: se repite mientras es falsa y se para cuando se hace verdadera.',
    'mod.repetirAntes.corto': 'que «repetir» comprueba la condición antes de ejecutar',
    'mod.repetirAntes.diag': 'Parece que has comprobado la condición antes de ejecutar el bloque. En «repetir … hasta» se ejecuta primero y se comprueba al final, así que el bloque se ejecuta al menos una vez.',
    'mod.constVariable.corto': 'que una constante se puede cambiar como una variable',
    'mod.constVariable.diag': 'Parece que has tratado la constante como una variable. No: una constante guarda su valor al crearla y no admite otro; si el programa lo intenta, se detiene con un error.',
    'mod.sinoSiempre.corto': 'que el «sino» se ejecuta también tras el «si»',
    'mod.sinoSiempre.diag': 'Parece que has ejecutado el «sino» después del «si». Es uno o el otro, nunca los dos.',

    'cons.caja.titulo': 'Guarda y usa valores',

    'cons.doble.titulo': 'Duplica el valor',
    'cons.doble.consigna': 'x vale 5 al principio. Duplica su valor y muéstralo: debe salir 10.',
    'cons.doble.trampa': '«x ← x * 2» primero calcula con el x de ahora y después guarda el resultado en x. No hay contradicción: es una orden, no una ecuación.',
    'cons.cambiar.titulo': 'Intercambia valores',

    'cons.doble.pista.suma': '«x ← x + 2» suma 2 al valor de x, no lo duplica: con x = 5 sale 7, no 10. Para duplicar, el valor se multiplica por 2.',
    'cons.cuenta.pista.sube': 'Con «n ← n + 1», n sube en cada vuelta y nunca llega a 0: la condición «n > 0» se cumple siempre y el bucle no termina. Para contar hacia atrás hay que restar 1.',

    'cons.vueltas.pista.limite': '«n <= 4» incluye el 4: el bucle da una vuelta más y se muestra el 4. Para que se pare en el 3, la condición tiene que ser «n < 4».',
    'cons.suma.pista.pisa': '«total ← i» sustituye el total por el valor de i en cada vuelta: al final solo queda el último (4). Para acumular hay que sumar a lo que ya había: «total ← total + i».',
    'cons.suma.pista.dentro': 'Si «mostrar total» está dentro del bucle, se muestra la suma parcial en cada vuelta (1 3 6 10). Para mostrar solo el resultado final, va después del «fin».',
    'cons.cambiar.pista.pisa': 'Fíjate en el estado final: a y b valen lo mismo, así que una de las dos copias pisó un valor antes de guardarlo. Cuando se ejecuta «b ← a», el valor anterior de b se pierde y ya no se puede recuperar. Guarda primero uno de los valores en aux, y usa aux después para devolverlo.',
